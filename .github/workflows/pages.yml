# Deploys the static portfolio in /portfolio to GitHub Pages on every push that touches it.
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main, claude/upbeat-albattani-6prbtl]
    paths: ["portfolio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # upload and deploy in separate jobs (the standard Pages setup): deploying in the same job right after the
  # upload sometimes ran before the artifact was listed ("No artifacts named github-pages were found")
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: portfolio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
