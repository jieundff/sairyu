<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jieun Seo Portfolio</title>
<style>
  :root {
    --bg: #f4f4f4;
    --card: #ffffff;
    --ink: #000000;
    --muted: #b8b8b8;
    --dot-idle: #d9d9d9;
    --c-p1: #3369ff;
    --c-p2: #5a9ba1;
    --c-p3: #e95039;
    --c-p4: #ff938b;
    --c-p5: #111111;
    --gap: clamp(16px, 2.2vw, 40px);
    --card-h: min(62vh, calc((100vw - 32px) * 9 / 16));
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #f4f4f4; }
  }
  :root[data-theme="dark"] { --bg: #f4f4f4; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- top indicator (circle = current panel, bars = others) ---------- */
  .indicator {
    position: fixed; top: clamp(20px, 5vh, 48px); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; z-index: 10; height: 34px;
  }
  .indicator button {
    height: 34px; width: 6px; background: var(--ink); border-radius: 0;
    transition: width .45s cubic-bezier(.7,0,.2,1), border-radius .45s cubic-bezier(.7,0,.2,1);
  }
  .indicator button.on { width: 34px; border-radius: 50%; }
  .indicator button:focus-visible { outline: 2px solid var(--c-p1); outline-offset: 3px; }

  /* ---------- horizontal track ---------- */
  .scroller { height: 100vh; }               /* real height set in JS */
  .stage { position: fixed; inset: 0; display: flex; align-items: center; overflow: hidden; }
  .track {
    display: flex; gap: var(--gap); align-items: flex-start;
    padding-inline: calc((100vw - var(--card-h) * 16 / 9) / 2);
    will-change: transform;
  }
  .panel { flex: none; display: flex; flex-direction: column; gap: 10px; }
  .label { font-size: 14px; color: var(--muted); letter-spacing: -0.02em; height: 18px; }
  .card {
    position: relative; height: var(--card-h); aspect-ratio: 16 / 9;
    background: var(--card); overflow: hidden; container-type: size;
  }
  .card.w1870 { aspect-ratio: 1870 / 1080; }

  /* ---------- Home ---------- */
  .home-nav {
    position: absolute; top: 4.6cqh; left: 3.6cqw; right: 4.1cqw;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 1.73cqw; letter-spacing: -0.06em;
  }
  .home-nav .who { display: flex; gap: 1.6cqw; }
  /* Figma 'Home' 331:880: Home 1236 / About 1399 / Works 1571 / Contact 1738 on a 1920 frame (~80px gaps) */
  .home-nav .links { display: flex; gap: 4.2cqw; }
  .home-nav .links a:nth-child(2) { margin-right: .66cqw; }
  .home-nav a { color: inherit; text-decoration: none; }
  .home-nav a:hover { text-decoration: underline; text-underline-offset: .2em; }
  .home-title {
    position: absolute; left: 3.65cqw; bottom: 5.6cqh;
    font-size: 6.667cqw; line-height: 1.055; letter-spacing: -0.06em; font-weight: 400;
  }

  /* ---------- Works ---------- */
  .works .shot {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .5s ease;
  }
  .works .shot.on { opacity: 1; }
  .works .soon {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 3cqw; letter-spacing: -0.04em; background: #ececec;
    opacity: 0; transition: opacity .5s ease;
  }
  .works .soon.on { opacity: 1; }
  .pager { display: flex; justify-content: center; gap: 12px; margin-top: clamp(12px, 3vh, 32px); }
  .pager button {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--dot-idle); color: #fff; font-size: 12px; letter-spacing: -0.02em;
    transition: background-color .35s ease, transform .2s ease;
  }
  .pager button:hover { transform: scale(1.08); }
  .pager button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .pager button[aria-pressed="true"] { background: var(--c); }

  /* ---------- Brand logo cards (parallax word) ---------- */
  .brand .card { aspect-ratio: 1870 / 1080; }
  .brand .logo {
    position: absolute; left: var(--l); top: var(--t); width: var(--w); height: auto;
    overflow: visible; will-change: transform;
  }

  /* ---------- Archive (isometric card stack) ---------- */
  .archive .iso { position: absolute; inset: 0; overflow: hidden; }
  .archive .iso-world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  .archive .iso-card {
    position: absolute; width: 160px; height: 90px; left: -80px; top: -90px;
    background-color: #ececec; background-size: cover; background-position: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    display: grid; place-items: center; font-size: 10px; color: #b5b5b5; letter-spacing: -0.02em;
  }
  .archive .iso-card { pointer-events: none; }
  .archive .iso-hit { position: absolute; width: 160px; height: 90px; left: -80px; top: -90px; }
  .archive .iso-label {
    position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none;
    font-size: 11px; letter-spacing: -0.02em; color: #111; transform-origin: 0 0;
  }
  .archive .iso-label small { color: #9a9a9a; margin-left: 6px; }
  /* overview annotations: a range bracket above each project's boards + tiny names lying under each board */
  .archive .iso-tag { position: absolute; left: 0; top: 0; pointer-events: none; transform-origin: 0 0;
    font-size: 11px; letter-spacing: -0.01em; color: #d0d0d0; white-space: nowrap; }
  .archive .iso-range { position: absolute; left: 0; top: 0; height: 0; pointer-events: none; transform-origin: 0 0;
    border-top: 1px solid var(--rc, #bbb); }
  .archive .iso-range::before, .archive .iso-range::after { content: ''; position: absolute; top: -4px;
    width: 0; height: 7px; border-left: 1px solid var(--rc, #bbb); }
  .archive .iso-range::before { left: 0; }
  .archive .iso-range::after { right: 0; }
  .archive .iso-range span { position: absolute; left: 0; bottom: 8px; font-size: 26px; letter-spacing: -0.03em;
    color: #111; white-space: nowrap; }
  .archive .arc-list {
    position: absolute; right: 3.4cqw; bottom: 3.5cqh; list-style: none; text-align: right;
    font-size: 1.55cqw; line-height: 2.25; letter-spacing: -0.06em; text-transform: uppercase;
  }
  .archive .arc-list li { color: #c9c9c9; transition: color .6s ease; }
  .archive .arc-list li.on { color: #000; }
  .archive .arc-list li[data-go] { cursor: pointer; }
  .archive .arc-list li[data-go]:hover { color: #6f6f6f; }
  .archive .arc-list li[data-go].on:hover { color: #000; }
  .archive .arc-list sup { font-size: .38em; vertical-align: 1.1em; margin-left: .45em; letter-spacing: 0; }
  .archive .arc-meta {
    position: absolute; left: 2.2cqw; top: 3cqh; font-size: 1.35cqw; line-height: 1.3;
    letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
  }


  /* ---------- Works page (5 books, side view) ---------- */
  #home-card .home-nav { z-index: 3; }
  #home-card .home-nav a.cur { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
  #home-card .view { position: absolute; inset: 0; transition: opacity .5s ease, visibility .5s; }
  #home-card .view-works { opacity: 0; visibility: hidden; }
  #home-card.is-works .view-works { opacity: 1; visibility: visible; }
  #home-card.is-works .view-home { opacity: 0; visibility: hidden; }
  /* reader: the standing cover continues into the project pages, scrolled inside the card */
  .reader {
    position: absolute; inset: 10cqh 0 0 0; z-index: 2; overflow-y: auto; overscroll-behavior: contain;
    opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s;
    scrollbar-width: none; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 3cqh);
            mask-image: linear-gradient(to bottom, transparent 0, #000 3cqh);
  }
  .reader::-webkit-scrollbar { display: none; }
  .reader.on { opacity: 1; visibility: visible; }
  .reader .rd-inner { margin: 0 auto; display: flex; flex-direction: column; gap: 1.6cqw; padding-bottom: 8cqh; }
  .reader img { display: block; width: 100%; aspect-ratio: 16 / 9; height: auto; background: #f1f1f1; }
  .reader .rd-cover { cursor: pointer; box-shadow: 0 1.2cqw 3cqw rgba(0,0,0,.12); }
  .reader .rd-page { box-shadow: 0 .6cqw 2cqw rgba(0,0,0,.06); }
  /* the 2D export replaces the 3D book; switched instantly (never both half-transparent -> no blink) */
  .books.covered .book.open { visibility: hidden; }
  .books {
    position: absolute; inset: 0; perspective: 85cqw; perspective-origin: 50% 53%;
    --W: 46cqw; --D: 25.9cqw; --T: 2.1cqw;
  }
  .book {
    position: absolute; left: 50%; top: 0; width: 0; height: 0; transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.65, 0, .25, 1), opacity .5s ease;
  }
  .book > * { position: absolute; backface-visibility: hidden; }
  .book .face { width: var(--W); height: var(--D); left: calc(var(--W) / -2); top: calc(var(--D) / -2);
    background: #e9e9e9 center / 100% 100% no-repeat; }
  .book .top { transform: rotateX(90deg) translateZ(calc(var(--T) / 2)); }
  .book .bottom { transform: rotateX(-90deg) translateZ(calc(var(--T) / 2)); }
  .book .spine {
    width: var(--W); height: var(--T); left: calc(var(--W) / -2); top: calc(var(--T) / -2);
    transform: translateZ(calc(var(--D) / 2)); background: var(--sp, #e3e3e3); color: var(--ink2, #111);
    display: flex; align-items: center; justify-content: center; gap: .5em; white-space: nowrap;
    font-size: .95cqw; letter-spacing: -0.02em; cursor: pointer;
  }
  .book .spine b { font-weight: 700; }
  /* white book (Lundi): soft edge + shading so it reads against the white card */
  .book.light .spine { background: linear-gradient(#ffffff 0%, #f1f3f7 70%, #e6e9f0 100%); box-shadow: 0 .6cqw 1.6cqw rgba(30,40,70,.10); }
  .book.light .face::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(30,40,70,.10), rgba(30,40,70,.02) 45%, rgba(30,40,70,0) 70%); }
  .book.light .side { background: linear-gradient(#f3f4f8, #e2e5ec); }
  .book .spine span { opacity: .75; }
  .book .side { width: var(--D); height: var(--T); left: calc(var(--D) / -2); top: calc(var(--T) / -2); background: var(--sp2, #d6d6d6); }
  .book .side.l { transform: rotateY(-90deg) translateZ(calc(var(--W) / 2)); }
  .book .side.r { transform: rotateY(90deg) translateZ(calc(var(--W) / 2)); }
  .book.empty .spine { cursor: default; }
  .books.has-open .book:not(.open) { opacity: 0; }
  .books:not(.has-open) .book { transition-delay: 0s, .45s; }   /* closing: others fade back in as the book settles */      /* nothing shows through the standing cover */
  .book:not(.empty):not(.open) .spine:hover { filter: brightness(1.06); }

  /* ---------- Outro ---------- */
  .outro-name {
    position: absolute; left: 1.25cqw; right: 1.25cqw; bottom: 16cqh;
    font-size: 19.6cqw; font-weight: 700; letter-spacing: -0.05em; line-height: .8; white-space: nowrap;
  }

  .hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); transition: opacity .4s; z-index: 10;
  }

  @media (max-width: 640px) {
    :root { --card-h: calc((100vw - 32px) * 9 / 16); --gap: 16px; }
    .label { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .indicator button, .works .shot, .works .soon, .pager button { transition: none; }
  }
</style>
</head>

  <div class="hint" id="hint">Scroll →</div>

<script>
(() => {
  const track = document.getElementById('track');
  const scroller = document.getElementById('scroller');
  const panels = [...track.querySelectorAll('.panel')];
  const indicator = document.querySelector('.indicator');
  const hint = document.getElementById('hint');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // indicator: one slot per panel
  const dots = panels.map((p, i) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', p.dataset.name);
    b.addEventListener('click', () => goTo(i));
    indicator.appendChild(b);
    return b;
  });

  // vertical page scroll -> horizontal track translate
  let maxX = 0, offsets = [], current = 0, target = 0, gapPx = 0;
  const brandCards = [...document.querySelectorAll('.brand .card')];
  brandCards.forEach(c => { c._after = parseFloat(c.dataset.after); c._before = parseFloat(c.dataset.before); c._logo = c.querySelector('.logo'); c._panel = panels.indexOf(c.closest('.panel')); c._x = 0; c._v = 0; });
  let lastT = performance.now();

  // Archive page: the track pauses here for PIN_LEN px of scroll while the stack zooms in and flips
  const PIN = panels.findIndex(p => p.classList.contains('archive'));
  let PIN_LEN = 0;
  const toTrack = y => { const a = offsets[PIN]; return y <= a ? y : y <= a + PIN_LEN ? a : y - PIN_LEN; };
  const toScroll = i => offsets[i] + (i > PIN ? PIN_LEN : 0);

  // 50 portfolio pages as 16:9 boards. Resona = pages 1-9 (Figma "Page 9"); the rest are placeholders for now.
  const N = 50;
  const PAGES = Array.from({ length: N }, (_, i) =>
    i < 9 ? { src: `img/resona/${String(i + 1).padStart(2, '0')}.webp`, project: 'Resona' } : { src: null, project: 'Not yet' });
  const world = document.getElementById('iso-world');
  const floor = document.getElementById('iso-floor');   // floor labels live in their own layer, painted under every board
  const arcCard = document.getElementById('archive-card');
  const arcCount = document.getElementById('arc-count');
  const isoCards = PAGES.map((pg, i) => {
    const el = document.createElement('div');
    el.className = 'iso-card';
    if (pg.src) el.style.backgroundImage = `url(${pg.src})`;
    else el.textContent = String(i + 1).padStart(2, '0');
    world.appendChild(el);
    return el;
  });
  // invisible hit planes stay in the row, so a board that pops out never slips away from the cursor
  let hoverIdx = -1;
  const isoHits = isoCards.map((el, i) => {
    el._h = 0; el._hv = 0;
    const hit = document.createElement('div');
    hit.className = 'iso-hit';
    hit.addEventListener('pointerenter', () => { if (arcZ > 0.5) hoverIdx = i; });
    hit.addEventListener('pointerleave', () => { if (hoverIdx === i) hoverIdx = -1; });
    world.appendChild(hit);
    return hit;
  });
  // labels lying on the floor beside the boards: one at the start of each project, one under the current board
  const NO = { Lundi: '01', Gripon: '02', Resona: '03', Zzazan: '04', 'Not yet': '05' };
  const groups = PAGES.reduce((g, pg, i) => (i && PAGES[i - 1].project === pg.project ? g : [...g, { name: pg.project, start: i }]), []);
  const mkLabel = html => { const el = document.createElement('div'); el.className = 'iso-label'; el.innerHTML = html; floor.appendChild(el); return el; };
  groups.forEach(g => { g.el = mkLabel(`${g.name.toUpperCase()}<small>${NO[g.name]}</small>`); g.w = 0; });
  // overview annotations (shown on the small first view, fade out as the row zooms in)
  let tagsShown = true;
  const TAG_Z = 92;
  const RANGE_COLOR = { Lundi: '#3369ff', Gripon: '#5a9ba1', Resona: '#f08a78', Zzazan: '#ff938b', 'Not yet': '#c4c4c4' };
  groups.forEach((g, gi) => {
    g.end = gi + 1 < groups.length ? groups[gi + 1].start - 1 : N - 1;
    if (g.name === 'Not yet') return;                    // unfinished pages: no range / name
    g.range = document.createElement('div');
    g.range.className = 'iso-range';
    g.range.style.setProperty('--rc', RANGE_COLOR[g.name] || '#bbb');
    g.range.innerHTML = `<span>${g.name.toLowerCase()}</span>`;
    floor.appendChild(g.range);
  });
  const tags = PAGES.map(pg => {
    const el = document.createElement('div');
    if (pg.project === 'Not yet') return null;
    el.className = 'iso-tag';
    el.textContent = pg.project.toLowerCase();
    floor.appendChild(el);
    return el;
  });
  const listItems = [...document.querySelectorAll('#arc-list li[data-project]')];
  let curProject = null, labelAnim = false;
  // click a project name -> scroll to its first page; ALL -> back to the small overview row
  listItems.forEach(li => {
    const name = li.dataset.project;
    const g = groups.find(x => x.name === name);
    if (name && !g) return;                          // project without pages yet: not clickable
    li.dataset.go = '';
    li.addEventListener('click', () => {
      const y = name ? pageY(g.start) : offsets[PIN];
      scrollTo({ top: y, behavior: reduce ? 'auto' : 'smooth' });
    });
  });
  // pinned scroll layout: ZOOM_LEN px of free scroll to zoom in, then one STEP per page
  let ZOOM_LEN = 0;
  const STEP = 300;                                  // scroll px per page (video-like sensitivity)
  const pageY = k => offsets[PIN] + ZOOM_LEN + k * STEP;
  let arcZ = 0, arcA = 0, arcKey = '', arcVZ = 0, arcVA = 0, arcT = performance.now();
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const smooth = v => v * v * (3 - 2 * v);
  function renderArchive(y) {
    const zGoal = smooth(clamp01((y - offsets[PIN]) / ZOOM_LEN));
    const aGoal = Math.max(0, Math.min(N - 1, (y - pageY(0)) / STEP));   // continuous: follows the scroll
    // critically-damped springs give the scroll a soft inertia (no snapping, no flashing)
    const now = performance.now(), dt = Math.min(0.033, (now - arcT) / 1000); arcT = now;
    if (reduce) { arcZ = zGoal; arcA = aGoal; arcVZ = arcVA = 0; }
    else {
      arcVZ += (24 * (zGoal - arcZ) - 9.8 * arcVZ) * dt; arcZ += arcVZ * dt;
      arcVA += (14 * (aGoal - arcA) - 7.5 * arcVA) * dt; arcA += arcVA * dt;
    }
    // hover pop-out (reference video): the board under the cursor slides out of the row and back
    let hoverMoving = false, labelsMoving = false;
    isoCards.forEach((el, i) => {
      const goal = i === hoverIdx ? 1 : 0;
      // heavy, over-damped spring: starts reluctantly and eases out (~0.35s), a stiff "drawer" feel
      if (reduce) { el._h = goal; el._hv = 0; }
      else { el._hv += (82 * (goal - el._h) - 20 * el._hv) * dt; el._h += el._hv * dt; }
      if (Math.abs(goal - el._h) < 0.002 && Math.abs(el._hv) < 0.002) { el._h = goal; el._hv = 0; }
      if (el._h !== goal) hoverMoving = true;
    });
    const key = arcZ.toFixed(4) + '|' + arcA.toFixed(3) + '|' + arcCard.offsetWidth + '|' + hoverIdx;
    if (key === arcKey && !hoverMoving && !labelAnim) return;
    arcKey = key;
    // spacing from the reference still: dense stacks with one board alone in the centre gap.
    // arcA is continuous, so the gap glides along the row with the scroll instead of jumping.
    const GAP = 32 - 22 * arcZ;                            // long thin row -> dense stacks
    const G1 = 175 * arcZ, G2 = 175 * arcZ;
    const OUT_Y = 28 * arcZ, OUT_Z = 33 * arcZ;                // pop distance (was 50 / 60)
    const f = v => Math.max(0, Math.min(1, v));
    const xs = isoCards.map((el, i) => {
      const x = i * GAP + G1 * f(i - arcA + 0.5) + G2 * f(i - arcA - 0.5);
      const b = el._h;
      el.style.transform = `translate3d(${x.toFixed(2)}px,${(OUT_Y * b).toFixed(2)}px,${(OUT_Z * b).toFixed(2)}px) rotateY(-90deg)`;
      isoHits[i].style.transform = `translate3d(${x.toFixed(2)}px,0,0) rotateY(-90deg)`;
      return x;
    });
    const k = Math.round(arcA), xa = xs[k] ?? 0;
    const fx = N * GAP / 2 * (1 - arcZ) + (arcA * GAP + G1) * arcZ;   // camera glides with the gap
    const S = (1.12 + 2.65 * arcZ) * (arcCard.offsetWidth / 1870);
    world.style.transform = `scale(${S.toFixed(4)}) rotateX(-30deg) rotateY(38deg) translate3d(${(-fx).toFixed(2)}px,45px,0)`;
    floor.style.transform = world.style.transform;
    arcCount.textContent = String(k + 1).padStart(2, '0') + ' / ' + N;
    const LZ = 86, op = clamp01((arcZ - 0.4) / 0.4).toFixed(3);     // floor labels fade in with the zoom
    // floor label of the current project stays fixed under the centre board (pinned to the camera);
    // only when the project changes does it let go and slide left with its stack, while the next one slides in
    const pinX = arcA * GAP + G1 - 30;
    groups.forEach(g => {
      const goal = PAGES[k].project === g.name && arcZ > 0.5 ? 1 : 0;
      g.w = reduce ? goal : g.w + (goal - g.w) * Math.min(1, 6 * dt);
      if (Math.abs(goal - g.w) < 0.001) g.w = goal; else labelsMoving = true;
      const x = (xs[g.start] - 30) * (1 - g.w) + pinX * g.w;
      g.el.style.opacity = op;
      g.el.style.transform = `translate3d(${x.toFixed(2)}px,0,${LZ}px) rotateX(90deg)`;
    });
    labelAnim = labelsMoving;
    const opT = clamp01(1 - arcZ / 0.35);
    if (opT > 0 || tagsShown) {
      tagsShown = opT > 0;
      groups.forEach(g => {
        if (!g.range) return;
        const x0 = xs[g.start], x1 = xs[g.end];                       // first .. last board of the project
        g.range.style.opacity = opT.toFixed(3);
        g.range.style.width = Math.max(10, x1 - x0) + 'px';
        g.range.style.transform = `translate3d(${x0.toFixed(2)}px,-104px,-80px)`;   // just above the boards' top edge, back side
      });
      tags.forEach((el, i) => {
        if (!el) return;
        el.style.opacity = opT.toFixed(3);
        // lying on the floor in front of each board, reading away from it (across the row, like the reference)
        el.style.transform = `translate3d(${(xs[i] + 4).toFixed(2)}px,0,${TAG_Z}px) rotateX(90deg) rotateZ(90deg)`;
      });
    }
    // overview (small row) -> ALL is active; once zoomed in -> the current page's project is active
    const active = arcZ < 0.5 ? '' : PAGES[k].project;
    if (active !== curProject) {
      curProject = active;
      listItems.forEach(li => li.classList.toggle('on', li.dataset.project === curProject));
    }
  }


  function measure() {
    maxX = Math.max(0, track.scrollWidth - innerWidth);
    ZOOM_LEN = Math.round(innerHeight * 1.2);
    PIN_LEN = ZOOM_LEN + (N - 1) * STEP;
    scroller.style.height = (maxX + PIN_LEN + innerHeight) + 'px';
    const pad = parseFloat(getComputedStyle(track).paddingLeft);
    offsets = panels.map(p => Math.min(maxX, Math.max(0, p.offsetLeft - pad - (innerWidth - 2 * pad - p.offsetWidth) / 2)));
    target = toTrack(scrollY);
    gapPx = parseFloat(getComputedStyle(track).columnGap) || 0;
  }
  function goTo(i) { scrollTo({ top: toScroll(i), behavior: reduce ? 'auto' : 'smooth' }); }

  function setActive(x) {
    let best = 0, d = Infinity;
    offsets.forEach((o, i) => { const k = Math.abs(o - x); if (k < d) { d = k; best = i; } });
    dots.forEach((b, i) => { b.classList.toggle('on', i === best); b.setAttribute('aria-current', i === best ? 'true' : 'false'); });
  }

  function tick() {
    target = Math.min(maxX, toTrack(scrollY));
    renderArchive(scrollY);
    current = reduce ? target : current + (target - current) * 0.12;
    if (Math.abs(target - current) < 0.1) current = target;
    track.style.transform = `translate3d(${-current}px,0,0)`;
    setActive(current);
    // rauno.me-style word slide: the word is coupled 1:1 to scroll distance (in card px),
    // clamped at both ends, and follows that target through a heavy, slightly over-damped spring
    // (stiffness 90, damping 20): the word trails the scroll and settles slowly instead of snapping.
    const now = performance.now();
    const dt = Math.min(0.032, (now - lastT) / 1000); lastT = now;
    brandCards.forEach(c => {
      const W = c.offsetWidth, step = W + gapPx;
      const d = target - offsets[c._panel];               // >0: scrolled on past this page, <0: scrolled back
      const maxR = c._after * W, maxL = c._before * W;      // travel needed to show word end / word start
      const kR = Math.max(1, maxR / (0.9 * step)), kL = Math.max(1, maxL / (0.9 * step));
      const goal = d > 0 ? -Math.min(d * kR, maxR) : Math.min(-d * kL, maxL); // 0 = boxed thumbnail
      if (reduce) { c._x = goal; c._v = 0; }
      else { c._v += (90 * (goal - c._x) - 20 * c._v) * dt; c._x += c._v * dt; }
      c._logo.style.transform = `translate3d(${c._x.toFixed(2)}px,0,0)`;
    });
    hint.style.opacity = current > 20 ? 0 : 1;
    requestAnimationFrame(tick);
  }

  // horizontal wheel / trackpad swipe also moves the page
  addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { scrollBy(0, e.deltaX); e.preventDefault(); }
  }, { passive: false });

  addEventListener('keydown', e => {
    const i = dots.findIndex(b => b.classList.contains('on'));
    if (e.key === 'ArrowRight') goTo(Math.min(panels.length - 1, i + 1));
    if (e.key === 'ArrowLeft') goTo(Math.max(0, i - 1));
  });

  document.querySelectorAll('[data-goto]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); goTo(+a.dataset.goto);
  }));

  // Works: p1~p5 switch the card content and colour the active button
  const layers = [...document.querySelectorAll('#works-card [data-key]')];
  const pager = [...document.querySelectorAll('.pager button')];
  const label = document.getElementById('works-label');
  function show(key) {
    layers.forEach(l => l.classList.toggle('on', l.dataset.key === key));
    pager.forEach(b => b.setAttribute('aria-pressed', b.dataset.key === key ? 'true' : 'false'));
    const btn = pager.find(b => b.dataset.key === key);
    label.textContent = btn ? btn.dataset.title : 'Device';
  }
  pager.forEach(b => b.addEventListener('click', () => {
    show(b.getAttribute('aria-pressed') === 'true' ? 'device' : b.dataset.key);
  }));


  // ---------- Works page: five books seen edge-on; clicking a spine stands the book up to show its cover
  const BOOKS = [
    { name: 'Lundi',   sub: '런디, 세탁소 운영의 디지털 표준',                 cover: 'img/covers/lundi.webp',  sp: '#ffffff', ink: '#1f4fd8', sp2: '#e6ecfb', light: true },
    { name: 'Gripon',  sub: '클라이머를 위한 햅틱 그립',                       cover: 'img/covers/gripon.webp', sp: '#4f8b8f', ink: '#ffffff', sp2: '#3f7276' },
    { name: 'Resona',  sub: '시각장애인 부모를 위한 실내용 아이 인지 디바이스', cover: 'img/covers/resona.webp', sp: '#e95039', ink: '#ffffff', sp2: '#c7412d',
      // page 01 repeats the cover, so the reader starts from page 02
      pages: Array.from({ length: 8 }, (_, i) => `img/resona-full/${String(i + 2).padStart(2, '0')}.webp`) },
    { name: 'Zza-zan', sub: '아이 사진을 태그로 쉽고 빠르게 찾고 공유해요',     cover: 'img/covers/zzazan.webp', sp: '#ffecea', ink: '#ff5f55', sp2: '#f7d9d6' },
    null,                                                                     // 5th project: not yet
  ];
  const homeCard = document.getElementById('home-card');
  const homeLabel = document.getElementById('home-label');
  const booksEl = document.getElementById('books');
  const reader = document.getElementById('reader');
  const rdInner = document.getElementById('rd-inner');
  const bookY = i => 34 + i * 11.5;                     // cqh: vertical slot of each book (eye level ~ book 3)
  const bookEls = BOOKS.map((b, i) => {
    const el = document.createElement('div');
    el.className = 'book' + (b ? (b.light ? ' light' : '') : ' empty');
    if (b) { el.style.setProperty('--sp', b.sp); el.style.setProperty('--ink2', b.ink); el.style.setProperty('--sp2', b.sp2); }
    const cover = b ? `style="background-image:url(${b.cover})"` : '';
    el.innerHTML = `<div class="face top" ${cover}></div><div class="face bottom" ${cover}></div>`
      + `<div class="side l"></div><div class="side r"></div>`
      + `<button class="spine" ${b ? `aria-label="${b.name} 표지 보기"` : 'tabindex="-1" aria-hidden="true"'}>`
      + (b ? `<b>${b.name}</b><span>${b.sub}</span>` : '') + `</button>`;
    booksEl.appendChild(el);
    return el;
  });
  let openBook = -1, coverTimer = 0, closing = false;
  function layoutBooks() {
    booksEl.classList.toggle('has-open', openBook >= 0);
    clearTimeout(coverTimer);
    bookEls.forEach((el, i) => {
      const open = i === openBook;
      el.classList.toggle('open', open);
      // lying: stacked at its slot. open: the spine rises (rotateX 90deg) and the book comes forward,
      // in front of every other book, so the underside cover faces the viewer
      el.style.transform = open
        ? `translate3d(0, 50cqh, 16cqw) rotateX(90deg) scale(.9)`
        : `translate3d(0, ${bookY(i)}cqh, 0)`;
    });
    if (openBook < 0) return;
    // once standing, swap the 3D book for the flat 2D Figma export (exact 16:9, full resolution)
    // placed on the same spot, followed by the project's pages that scroll inside the card
    const book = BOOKS[openBook], face = bookEls[openBook].querySelector('.bottom');
    coverTimer = setTimeout(() => {
      const r = face.getBoundingClientRect();
      rdInner.innerHTML = `<img class="rd-cover" src="${book.cover}" alt="${book.name} 표지">`
        + (book.pages || []).map((src, n) => `<img class="rd-page" src="${src}" alt="${book.name} ${n + 1}" loading="lazy">`).join('');
      rdInner.style.width = r.width + 'px';
      reader.scrollTop = 0;
      const top = reader.getBoundingClientRect().top;
      rdInner.style.paddingTop = (r.top + (r.height - r.width * 9 / 16) / 2 - top) + 'px';
      reader.classList.add('on');                          // fade the flat cover in over the standing book
      coverTimer = setTimeout(() => booksEl.classList.add('covered'), reduce ? 0 : 320);   // then hide the 3D book
    }, reduce ? 0 : 1100);
  }
  function openBookAt(i) { if (closing) return; openBook = i; layoutBooks(); }
  // closing: scroll back to the cover, cross-fade the 2D cover into the 3D book that is already standing
  // underneath at the same spot, and only then lay the book down, so there is no jump
  function closeBook() {
    if (openBook < 0 || closing) return;
    closing = true;
    clearTimeout(coverTimer);
    const settle = () => {
      booksEl.classList.remove('covered');                 // 3D book back underneath first, fully opaque
      requestAnimationFrame(() => requestAnimationFrame(() => reader.classList.remove('on')));   // then fade the cover off it
      setTimeout(() => { openBook = -1; layoutBooks(); closing = false; }, reduce ? 0 : 340);
    };
    if (!reader.classList.contains('on') || reader.scrollTop < 2) return settle();
    reader.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    const wait = () => (reader.scrollTop < 2 ? settle() : requestAnimationFrame(wait));
    requestAnimationFrame(wait);
  }
  bookEls.forEach((el, i) => {
    if (!BOOKS[i]) return;
    el.addEventListener('click', () => (openBook === i ? closeBook() : openBookAt(i)));
  });
  reader.addEventListener('click', e => { if (e.target.classList.contains('rd-cover') || e.target === reader || e.target === rdInner) closeBook(); });
  booksEl.addEventListener('click', e => { if (e.target === booksEl) closeBook(); });
  // Works lives inside the first card, so the neighbouring pages and the top indicator stay in place
  function setView(v) {
    const works = v === 'works';
    homeCard.classList.toggle('is-works', works);
    homeLabel.textContent = works ? 'Works' : 'Home';
    homeCard.querySelectorAll('[data-view]').forEach(a => a.classList.toggle('cur', works && a.dataset.view === 'works'));
    if (!works) { reader.classList.remove('on'); booksEl.classList.remove('covered'); closing = false; openBook = -1; layoutBooks(); }
  }
  homeCard.querySelectorAll('[data-view]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    setView(a.dataset.view);
    goTo(0);
  }));
  addEventListener('keydown', e => {
    if (e.key === 'Escape') closeBook();
  });
  layoutBooks();

  addEventListener('resize', measure);
  addEventListener('load', measure);
  measure();
  current = target;
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
