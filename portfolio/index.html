<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jieun Seo Portfolio</title>
<style>
  :root {
    --bg: #f4f4f4;
    --card: #ffffff;
    --ink: #000000;
    --muted: #b8b8b8;
    --dot-idle: #d9d9d9;
    --c-p1: #3369ff;
    --c-p2: #5a9ba1;
    --c-p3: #e95039;
    --c-p4: #ff938b;
    --c-p5: #111111;
    --gap: clamp(16px, 2.2vw, 40px);
    --card-h: min(62vh, calc((100vw - 32px) * 9 / 16));
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #f4f4f4; }
  }
  :root[data-theme="dark"] { --bg: #f4f4f4; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--font); }
  body { overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- top indicator (circle = current panel, bars = others) ---------- */
  .indicator {
    position: fixed; top: clamp(20px, 5vh, 48px); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; z-index: 10; height: 34px;
  }
  .indicator button {
    height: 34px; width: 6px; background: var(--ink); border-radius: 0;
    transition: width .45s cubic-bezier(.7,0,.2,1), border-radius .45s cubic-bezier(.7,0,.2,1);
  }
  .indicator button.on { width: 34px; border-radius: 50%; }
  .indicator button:focus-visible { outline: 2px solid var(--c-p1); outline-offset: 3px; }

  /* ---------- horizontal track ---------- */
  .scroller { height: 100vh; }               /* real height set in JS */
  .stage { position: fixed; inset: 0; display: flex; align-items: center; overflow: hidden; }
  .track {
    display: flex; gap: var(--gap); align-items: flex-start;
    padding-inline: calc((100vw - var(--card-h) * 16 / 9) / 2);
    will-change: transform;
  }
  .panel { flex: none; display: flex; flex-direction: column; gap: 10px; }
  .label { font-size: 14px; color: var(--muted); letter-spacing: -0.02em; height: 18px; }
  .card {
    position: relative; height: var(--card-h); aspect-ratio: 16 / 9;
    background: var(--card); overflow: hidden; container-type: size;
  }
  .card.w1870 { aspect-ratio: 1870 / 1080; }

  /* ---------- Home ---------- */
  .home-nav {
    position: absolute; top: 4.6cqh; left: 3.6cqw; right: 4.1cqw;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 1.73cqw; letter-spacing: -0.06em;
  }
  .home-nav .who { display: flex; gap: 1.6cqw; }
  /* on a 1920 frame: Works 1571 / Profile 1738 (Figma); Home moved next to Works with the same ~80px gap */
  .home-nav .links { position: absolute; left: -3.6cqw; top: 50%; width: 100cqw; height: 0; }
  .home-nav .links a { position: absolute; top: 0; transform: translateY(-50%); white-space: nowrap; }
  .home-nav .links a[data-view="home"] { left: 73.333cqw; }
  .home-nav .links a[data-view="works"] { left: 81.823cqw; }
  .home-nav .links a[data-view="profile"] { left: 90.501cqw; }
  .home-nav .who-profile { display: none; }
  #home-card.is-profile .home-nav .who span { display: none; }
  #home-card.is-profile .home-nav .who .who-profile { display: inline; }
  .home-nav a { color: inherit; text-decoration: none; }
  .home-nav a:hover { text-decoration: underline; text-underline-offset: .2em; }
  .home-title {
    position: absolute; left: 3.65cqw; bottom: 5.6cqh;
    font-size: 6.667cqw; line-height: 1.055; letter-spacing: -0.06em; font-weight: 400;
  }

  /* ---------- Works ---------- */
  .works .shot {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .5s ease;
  }
  .works .shot.on { opacity: 1; }
  .works .soon {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 3cqw; letter-spacing: -0.04em; background: #ececec;
    opacity: 0; transition: opacity .5s ease;
  }
  .works .soon.on { opacity: 1; }
  .pager { display: flex; justify-content: center; gap: 12px; margin-top: clamp(12px, 3vh, 32px); }
  .pager button {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--dot-idle); color: #fff; font-size: 12px; letter-spacing: -0.02em;
    transition: background-color .35s ease, transform .2s ease;
  }
  .pager button:hover { transform: scale(1.08); }
  .pager button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .pager button[aria-pressed="true"] { background: var(--c); }

  /* ---------- Brand logo cards (parallax word) ---------- */
  .brand .card { aspect-ratio: 1870 / 1080; }
  .brand .logo {
    position: absolute; left: var(--l); top: var(--t); width: var(--w); height: auto;
    overflow: visible; will-change: transform;
  }

  /* ---------- Archive (isometric card stack) ---------- */
  .archive .iso { position: absolute; inset: 0; overflow: hidden; }
  .archive .iso-world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  .archive .iso-card {
    position: absolute; width: 160px; height: 90px; left: -80px; top: -90px;
    background-color: #ececec; background-size: cover; background-position: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    display: grid; place-items: center; font-size: 10px; color: #b5b5b5; letter-spacing: -0.02em;
  }
  .archive .iso-card { pointer-events: none; }
  .archive .iso-hit { position: absolute; width: 160px; height: 90px; left: -80px; top: -90px; }
  .archive .iso-label {
    position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none;
    font-size: 11px; letter-spacing: -0.02em; color: #111; transform-origin: 0 0;
  }
  .archive .iso-label small { color: #9a9a9a; margin-left: 6px; }
  /* overview annotations: a range bracket above each project's boards + tiny names lying under each board */
  .archive .iso-tag { position: absolute; left: 0; top: 0; pointer-events: none; transform-origin: 0 0;
    font-size: 11px; letter-spacing: -0.01em; color: #d0d0d0; white-space: nowrap; }
  .archive .iso-range { position: absolute; left: 0; top: 0; height: 0; pointer-events: none; transform-origin: 0 0;
    border-top: 1px solid var(--rc, #bbb); }
  .archive .iso-range::before, .archive .iso-range::after { content: ''; position: absolute; top: -4px;
    width: 0; height: 7px; border-left: 1px solid var(--rc, #bbb); }
  .archive .iso-range::before { left: 0; }
  .archive .iso-range::after { right: 0; }
  .archive .iso-range span { position: absolute; left: 0; bottom: 8px; font-size: 26px; letter-spacing: -0.03em;
    color: #111; white-space: nowrap; }
  .archive .arc-list {
    position: absolute; right: 3.4cqw; bottom: 3.5cqh; list-style: none; text-align: right;
    font-size: 1.55cqw; line-height: 2.25; letter-spacing: -0.06em; text-transform: uppercase;
  }
  .archive .arc-list li { color: #c9c9c9; transition: color .6s ease; }
  .archive .arc-list li.on { color: #000; }
  .archive .arc-list li[data-go] { cursor: pointer; }
  .archive .arc-list li[data-go]:hover { color: #6f6f6f; }
  .archive .arc-list li[data-go].on:hover { color: #000; }
  .archive .arc-list sup { font-size: .38em; vertical-align: 1.1em; margin-left: .45em; letter-spacing: 0; }
  .archive .arc-meta {
    position: absolute; left: 2.2cqw; top: 3cqh; font-size: 1.35cqw; line-height: 1.3;
    letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
  }


  /* ---------- Works page (5 books, side view) ---------- */
  #home-card .home-nav { z-index: 3; }
  #home-card .home-nav a.cur { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
  #home-card .view { position: absolute; inset: 0; transition: opacity .5s ease, visibility .5s; }
  #home-card .view-works { opacity: 0; visibility: hidden; }
  #home-card.is-works .view-works { opacity: 1; visibility: visible; }
  #home-card.is-works .view-home, #home-card.is-profile .view-home { opacity: 0; visibility: hidden; }
  /* reader: the standing cover continues into the project pages, scrolled inside the card */
  .reader {
    position: absolute; inset: 10cqh 0 0 0; z-index: 2; overflow-y: auto; overscroll-behavior: contain;
    opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility .3s;
    scrollbar-width: none; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 3cqh);
            mask-image: linear-gradient(to bottom, transparent 0, #000 3cqh);
  }
  .reader::-webkit-scrollbar { display: none; }
  .reader.on { opacity: 1; visibility: visible; }
  .reader .rd-inner { margin: 0 auto; display: flex; flex-direction: column; gap: 1.6cqw; padding-bottom: 8cqh; }
  .reader img { display: block; width: 100%; aspect-ratio: 16 / 9; height: auto; background: #f1f1f1; }
  .reader .rd-cover { cursor: pointer; box-shadow: 0 1.2cqw 3cqw rgba(0,0,0,.12); }
  .reader .rd-page { box-shadow: 0 .6cqw 2cqw rgba(0,0,0,.06); }
  /* the 2D export replaces the 3D book; switched instantly (never both half-transparent -> no blink) */
  .books.covered .book.open { visibility: hidden; }
  .books {
    position: absolute; inset: 0; perspective: 85cqw; perspective-origin: 50% 53%;
    --W: 46cqw; --D: 25.9cqw; --T: 2.1cqw;
  }
  .book {
    position: absolute; left: 50%; top: 0; width: 0; height: 0; transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.65, 0, .25, 1), opacity .5s ease;
  }
  .book > * { position: absolute; backface-visibility: hidden; }
  .book .face { width: var(--W); height: var(--D); left: calc(var(--W) / -2); top: calc(var(--D) / -2);
    background: #e9e9e9 center / 100% 100% no-repeat; }
  .book .top { transform: rotateX(90deg) translateZ(calc(var(--T) / 2)); }
  .book .bottom { transform: rotateX(-90deg) translateZ(calc(var(--T) / 2)); }
  .book .spine {
    width: var(--W); height: var(--T); left: calc(var(--W) / -2); top: calc(var(--T) / -2);
    transform: translateZ(calc(var(--D) / 2)); background: var(--sp, #e3e3e3); color: var(--ink2, #111);
    display: flex; align-items: center; justify-content: center; gap: .5em; white-space: nowrap;
    font-size: .95cqw; letter-spacing: -0.02em; cursor: pointer;
  }
  .book .spine b { font-weight: 700; }
  /* white book (Lundi): soft edge + shading so it reads against the white card */
  .book.light .spine { background: linear-gradient(#ffffff 0%, #f1f3f7 70%, #e6e9f0 100%); box-shadow: 0 .6cqw 1.6cqw rgba(30,40,70,.10); }
  .book.light .face::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(30,40,70,.10), rgba(30,40,70,.02) 45%, rgba(30,40,70,0) 70%); }
  .book.light .side { background: linear-gradient(#f3f4f8, #e2e5ec); }
  .book .spine span { opacity: .75; }
  .book .side { width: var(--D); height: var(--T); left: calc(var(--D) / -2); top: calc(var(--T) / -2); background: var(--sp2, #d6d6d6); }
  .book .side.l { transform: rotateY(-90deg) translateZ(calc(var(--W) / 2)); }
  .book .side.r { transform: rotateY(90deg) translateZ(calc(var(--W) / 2)); }
  .book.empty .spine { cursor: default; }
  .books.has-open .book:not(.open) { opacity: 0; }
  .books:not(.has-open) .book { transition-delay: 0s, .45s; }   /* closing: others fade back in as the book settles */      /* nothing shows through the standing cover */
  .book:not(.empty):not(.open) .spine:hover { filter: brightness(1.06); }

  /* ---------- Outro ---------- */
  .outro-name {
    position: absolute; left: 1.25cqw; right: 1.25cqw; bottom: 16cqh;
    font-size: 19.6cqw; font-weight: 700; letter-spacing: -0.05em; line-height: .8; white-space: nowrap;
  }

  /* ---------- Gallery: images floating on a sphere ---------- */
  .globe-btn { align-self: center; margin-top: clamp(14px, 3.4vh, 36px); width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center; transition: transform .35s cubic-bezier(.65,0,.25,1); }
  .globe-btn:hover { transform: scale(1.08); }
  .globe-btn[aria-pressed="true"] { transform: rotate(90deg); }
  .globe-btn:focus-visible { outline: 2px solid #111; outline-offset: 4px; }
  .archive .iso, .archive .arc-meta, .archive .arc-list { transition: opacity .6s ease; }
  #archive-card.sphere-on .iso, #archive-card.sphere-on .arc-meta, #archive-card.sphere-on .arc-list { opacity: 0; pointer-events: none; }
  #archive-card .sph { z-index: 4; opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility .6s; }
  #archive-card.sphere-on .sph { opacity: 1; visibility: visible; }
  .sph { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: pan-y;
    background: #ffffff; }
  .sph.drag { cursor: grabbing; }
  .sph-item { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform, opacity;
    box-shadow: 0 .3cqw 1cqw rgba(0,0,0,.10); }
  .sph-item img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; }
  .sph-item i { position: absolute; inset: 0; background: #b4baba; opacity: 0; }   /* silhouette used while vanishing */
  .sph-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- landing intro (ASCII pixels) ---------- */
  .intro { position: fixed; inset: 0; z-index: 100; background: #fff; cursor: pointer; transition: opacity .8s ease; }
  .intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .intro.started { cursor: default; }
  .intro.gone { opacity: 0; pointer-events: none; }

  /* ---------- fullscreen card ---------- */
  .track .card { cursor: zoom-in; }
  .fs-overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; visibility: hidden; }
  .fs-overlay.active { visibility: visible; }
  .fs-overlay::before { content: ''; position: absolute; inset: 0; background: var(--bg); opacity: 0; transition: opacity .45s ease; }
  .fs-overlay.open::before { opacity: 1; }
  .fs-wrap { display: contents; }   /* carries the panel's class so its card styles keep applying */
  .fs-overlay .card { position: relative; width: auto; height: min(100vh, calc(100vw / var(--ar))); aspect-ratio: var(--ar); cursor: auto; }
  .fs-overlay .pager { position: absolute; left: 50%; bottom: 2.5vh; transform: translateX(-50%); margin: 0; z-index: 2; }
  .fs-close {
    position: absolute; top: 18px; right: 18px; z-index: 3; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,.06); display: grid; place-items: center; opacity: 0; transition: opacity .3s ease .2s;
  }
  .fs-overlay.open .fs-close { opacity: 1; }
  .fs-close:hover { background: rgba(0,0,0,.12); }
  .fs-close::before, .fs-close::after { content: ''; position: absolute; width: 16px; height: 1.5px; background: #111; }
  .fs-close::before { transform: rotate(45deg); }
  .fs-close::after { transform: rotate(-45deg); }

  .hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); transition: opacity .4s; z-index: 10;
  }

  @media (max-width: 640px) {
    :root { --card-h: calc((100vw - 32px) * 9 / 16); --gap: 16px; }
    .label { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .indicator button, .works .shot, .works .soon, .pager button { transition: none; }
  }
</style>
</head>
<body>
  <div class="intro" id="intro" role="button" aria-label="클릭해서 포트폴리오 시작하기"><canvas aria-hidden="true"></canvas></div>
  <nav class="indicator" aria-label="패널 이동"></nav>

  <div class="scroller" id="scroller"></div>
  <div class="stage">
    <div class="track" id="track">

      <section class="panel" data-name="Home">
        <div class="label" id="home-label">Home</div>
        <div class="card" id="home-card">
          <div class="home-nav">
            <div class="who"><span>Jieun.Seo</span><span>|</span><span>UX Designer</span><span class="who-profile">Profile</span></div>
            <div class="links">
              <a href="#home" data-view="home">Home</a>
              <a href="#works" data-view="works">Works</a>
              <a href="#profile" data-view="profile">Profile</a>
            </div>
          </div>
          <div class="view view-home"><h1 class="home-title">A Designer<br>Who Discovers Possibilities.</h1></div>
          <div class="view view-works">
            <div class="books" id="books"></div>
            <div class="reader" id="reader"><div class="rd-inner" id="rd-inner"></div></div>
          </div>
        </div>
      </section>


      <section class="panel works" data-name="Works">
        <div class="label" id="works-label">Device</div>
        <div class="card w1870" id="works-card">
          <img class="shot on" data-key="device" src="img/device.webp?v=1125b" alt="RESONA, GRIPON, LUNDI, ZZAZAN 기기 모음">
          <img class="shot" data-key="p1" src="img/p1.webp?v=1125b" alt="LUNDI 상세" loading="lazy">
          <img class="shot" data-key="p2" src="img/p2.webp?v=1125b" alt="GRIPON 상세" loading="lazy">
          <img class="shot" data-key="p3" src="img/p3.webp?v=1125b" alt="RESONA 상세" loading="lazy">
          <img class="shot" data-key="p4" src="img/p4.webp?v=1125b" alt="ZZAZAN 상세" loading="lazy">
          <div class="soon" data-key="p5">p5 — 준비 중</div>
        </div>
        <div class="pager" role="group" aria-label="포트폴리오 선택">
          <button style="--c: var(--c-p1)" data-key="p1" data-title="Lundi" aria-pressed="false">p1</button>
          <button style="--c: var(--c-p2)" data-key="p2" data-title="Gripon" aria-pressed="false">p2</button>
          <button style="--c: var(--c-p3)" data-key="p3" data-title="Resona" aria-pressed="false">p3</button>
          <button style="--c: var(--c-p4)" data-key="p4" data-title="Zzazan" aria-pressed="false">p4</button>
          <button style="--c: var(--c-p5)" data-key="p5" data-title="p5" aria-pressed="false">p5</button>
        </div>
      </section>

      <section class="panel archive" data-name="Archive">
        <div class="label">Archive</div>
        <div class="card w1870" id="archive-card">
          <div class="iso"><div class="iso-world" id="iso-floor"></div><div class="iso-world" id="iso-world"></div></div>
          <div class="sph" id="sph"><canvas class="sph-bg" id="sph-bg" aria-hidden="true"></canvas></div>
          <div class="arc-meta"><span id="arc-count">001</span></div>
          <ul class="arc-list" id="arc-list">
            <li class="all on" data-project="">All</li>
            <li data-project="Lundi">Lundi<sup>01</sup></li>
            <li data-project="Gripon">Gripon<sup>02</sup></li>
            <li data-project="Resona">Resona<sup>03</sup></li>
            <li data-project="Zzazan">Zzazan<sup>04</sup></li>
            <li data-project="Not yet">Not yet<sup>05</sup></li>
          </ul>
        </div>
        <button class="globe-btn" id="globe-btn" aria-label="둥근 형태로 보기" aria-pressed="false">
          <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
            <circle cx="20" cy="20" r="19" fill="#111"/>
            <ellipse cx="20" cy="20" rx="7.5" ry="19" fill="none" stroke="#fff" stroke-width="2.2"/>
            <line x1="1" y1="20" x2="39" y2="20" stroke="#fff" stroke-width="2.2"/>
          </svg>
        </button>
      </section>





      <section class="panel" data-name="Jieun.Seo">
        <div class="label">Jieun.Seo</div>
        <div class="card"><div class="outro-name">JIEUN.SEO</div></div>
      </section>

    </div>
  </div>

  <div class="fs-overlay" id="fs-overlay" aria-hidden="true"><button class="fs-close" id="fs-close" aria-label="전체화면 닫기"></button></div>
  <div class="hint" id="hint">Scroll →</div>

<script>
// ---------- landing intro: an ASCII spiral, then (on click, ~7s) the project thumbnails are rebuilt column by
// column out of characters, break apart and fall away, revealing the first page (after aino.agency)
(() => {
  const intro = document.getElementById('intro');
  const cv = intro.querySelector('canvas'), ctx = cv.getContext('2d');
  const reduceM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root = document.documentElement;
  root.style.overflow = 'hidden';
  // always start on page 1: the browser would otherwise restore the last scroll position on reload
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  scrollTo(0, 0);
  addEventListener('load', () => scrollTo(0, 0));
  const FONT = '"Courier New", ui-monospace, Menlo, monospace';
  const RAMP = " .`':,;-~^\"=+<>!*?|/\\()[]{}1iIl7tfjrJLYCXZUSOQD08GB&%#@";
  const NOISE = "%#@&8BGSDOQ0$?!*+=-:;.~^";
  // column order: 1 Lundi (Slide 488), 2 Gripon (487), 3 Resona (483), 4-5 not made yet
  // one project at a time: 1 Lundi (488), 2 Gripon (487), 3 Resona (483), 4 Zza-zan (478)
  const SRC = [{ src: 'img/intro/lundi.webp?v=1125b' }, { src: 'img/intro/gripon.webp?v=1125b' },
               { src: 'img/intro/resona.webp?v=1125b' }, { src: 'img/intro/zzazan.webp?v=1125b' }];
  const SLOT = 1350, T0 = 500, BUILD = 560, HOLD = 240;
  const FILL = 500, WIPE = 850, SHARP = 750;            // finale: fill the screen, wipe down to page 1 in ASCII, sharpen

      const open = i === openBook;
      el.classList.toggle('open', open);
      // lying: stacked at its slot. open: the spine rises (rotateX 90deg) and the book comes forward,
      // in front of every other book, so the underside cover faces the viewer
      el.style.transform = open
        ? `translate3d(0, 50cqh, 16cqw) rotateX(90deg) scale(.9)`
        : `translate3d(0, ${bookY(i)}cqh, 0)`;
    });
    if (openBook < 0) return;
    // once standing, swap the 3D book for the flat 2D Figma export (exact 16:9, full resolution)
    // placed on the same spot, followed by the project's pages that scroll inside the card
    const book = BOOKS[openBook], face = bookEls[openBook].querySelector('.bottom');
    coverTimer = setTimeout(() => {
      const r = face.getBoundingClientRect();
      rdInner.innerHTML = `<img class="rd-cover" src="${book.cover}" alt="${book.name} 표지">`
        + (book.pages || []).map((src, n) => `<img class="rd-page" src="${src}" alt="${book.name} ${n + 1}" loading="lazy">`).join('');
      rdInner.style.width = r.width + 'px';
      reader.scrollTop = 0;
      const top = reader.getBoundingClientRect().top;
      rdInner.style.paddingTop = (r.top + (r.height - r.width * 9 / 16) / 2 - top) + 'px';
      reader.classList.add('on');                          // fade the flat cover in over the standing book
      coverTimer = setTimeout(() => booksEl.classList.add('covered'), reduce ? 0 : 320);   // then hide the 3D book
    }, reduce ? 0 : 1100);
  }
  function openBookAt(i) { if (closing) return; openBook = i; layoutBooks(); }
  // closing: scroll back to the cover, cross-fade the 2D cover into the 3D book that is already standing
  // underneath at the same spot, and only then lay the book down, so there is no jump
  function closeBook() {
    if (openBook < 0 || closing) return;
    closing = true;
    clearTimeout(coverTimer);
    const settle = () => {
      booksEl.classList.remove('covered');                 // 3D book back underneath first, fully opaque
      requestAnimationFrame(() => requestAnimationFrame(() => reader.classList.remove('on')));   // then fade the cover off it
      setTimeout(() => { openBook = -1; layoutBooks(); closing = false; }, reduce ? 0 : 340);
    };
    if (!reader.classList.contains('on') || reader.scrollTop < 2) return settle();
    reader.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    const wait = () => (reader.scrollTop < 2 ? settle() : requestAnimationFrame(wait));
    requestAnimationFrame(wait);
  }
  bookEls.forEach((el, i) => {
    if (!BOOKS[i]) return;
    el.addEventListener('click', () => (openBook === i ? closeBook() : openBookAt(i)));
  });
  reader.addEventListener('click', e => { if (e.target.classList.contains('rd-cover') || e.target === reader || e.target === rdInner) closeBook(); });
  booksEl.addEventListener('click', e => { if (e.target === booksEl) closeBook(); });
  // Works lives inside the first card, so the neighbouring pages and the top indicator stay in place
  function setView(v) {
    const works = v === 'works';
    homeCard.classList.toggle('is-works', works);
    homeCard.classList.toggle('is-profile', v === 'profile');   // Profile: blank page, "Profile" on Jieun.Seo's spot
    homeLabel.textContent = { works: 'Works', profile: 'Profile' }[v] || 'Home';
    homeCard.querySelectorAll('[data-view]').forEach(a => a.classList.toggle('cur', v !== 'home' && a.dataset.view === v));
    if (!works) { reader.classList.remove('on'); booksEl.classList.remove('covered'); closing = false; openBook = -1; layoutBooks(); }
  }
  homeCard.querySelectorAll('[data-view]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    setView(a.dataset.view);
    goTo(0);
  }));
  addEventListener('keydown', e => {
    if (e.key === 'Escape') closeBook();
  });
  layoutBooks();

  // ---------- click a card -> it grows to fill the window (FLIP), Esc / X / scrolling away puts it back
  const fsOverlay = document.getElementById('fs-overlay');
  const fsClose = document.getElementById('fs-close');
  let fs = null;
  const INTERACTIVE = 'a, button, .book, .iso-hit, .reader, .arc-list li';
  function flip(el, from, to, done) {
    el.style.transformOrigin = '0 0';
    el.style.transform = `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width})`;
    el.getBoundingClientRect();
    el.style.transition = reduce ? 'none' : 'transform .6s cubic-bezier(.65, 0, .25, 1)';
    el.style.transform = '';
    const end = () => { el.style.transition = ''; el.style.transformOrigin = ''; done && done(); };
    if (reduce) end(); else setTimeout(end, 620);
  }
  function openFs(card) {
    if (fs) return;
    const panel = card.closest('.panel'), first = card.getBoundingClientRect();
    const ph = document.createElement('div');
    ph.style.cssText = `width:${first.width}px;height:${first.height}px;flex:none`;
    card.before(ph);
    const pager = panel.querySelector('.pager'), pph = pager && document.createElement('div');
    if (pager) { pph.style.cssText = `height:${pager.offsetHeight}px;margin-top:${getComputedStyle(pager).marginTop}`; pager.before(pph); }
    const wrap = document.createElement('div');
    wrap.className = panel.className + ' fs-wrap';
    fs = { card, ph, pager, pph, wrap, panelIdx: panels.indexOf(panel) };
    fsOverlay.style.setProperty('--ar', (first.width / first.height).toFixed(5));
    wrap.appendChild(card);
    if (pager) wrap.appendChild(pager);
    fsOverlay.insertBefore(wrap, fsClose);
    fsOverlay.classList.add('active', 'open');
    fsOverlay.setAttribute('aria-hidden', 'false');
    flip(card, first, card.getBoundingClientRect());
  }
  function closeFs() {
    if (!fs || fs.closing) return;
    const f = fs; f.closing = true;
    if (f.card === homeCard && openBook >= 0) {           // put a standing book back before the card shrinks
      reader.classList.remove('on'); booksEl.classList.remove('covered'); closing = false; openBook = -1; layoutBooks();
    }
    const from = f.card.getBoundingClientRect(), to = f.ph.getBoundingClientRect();
    fsOverlay.classList.remove('open');
    f.card.style.transformOrigin = '0 0';
    f.card.style.transition = reduce ? 'none' : 'transform .55s cubic-bezier(.65, 0, .25, 1)';
    f.card.style.transform = `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${to.width / from.width})`;
    setTimeout(() => {
      f.card.style.transition = ''; f.card.style.transform = ''; f.card.style.transformOrigin = '';
      f.ph.replaceWith(f.card);
      if (f.pager) f.pph.replaceWith(f.pager);
      f.wrap.remove();
      fsOverlay.classList.remove('active');
      fsOverlay.setAttribute('aria-hidden', 'true');
      fs = null;
    }, reduce ? 0 : 570);
  }
  track.querySelectorAll('.card').forEach(card => card.addEventListener('click', e => {
    if (fs || e.target.closest(INTERACTIVE)) return;                       // menus, buttons, books keep working
    if (card === homeCard && openBook >= 0) return;
    openFs(card);
  }));
  fsClose.addEventListener('click', closeFs);
  addEventListener('keydown', e => { if (e.key === 'Escape' && fs && openBook < 0) closeFs(); });

  addEventListener('resize', measure);
  addEventListener('load', measure);
  measure();
  current = target;
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
