<style>

    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>

//////////f/z/////fwAAAAAAAAAAAAAAcMD/A/////////////////////////////////////////////9zAAAADgAAAAAAAAgAAAAAAAAAAAAAAv7/////////////D/j//////wEAAAAAAAAAAAAA+If/B/7///////////////////////////////////////////8/AAAAHgAAAAAAAAAAAAAAAAAAAAAAof//////////////T/z//////wAAAAAAAAAAAAAA4A//B/7///////////////////////////////////////////93AAAAHwAAAAAAAACAAAAAAAAAAACAoP//////////////D/z//////wAAAAAAAAAAAAAA4I//Afj///////////////////////////////////////////83AAAA/wAAAAAAAAAABAAAAAAAAABA+P//////////////D/z/////fAAAAAAAAAAAAAAA8A/8AAD+7////////////////////////////////////////+chAAAA/wAAAAAAAAAAAAAAAAAAAAAA8P//////////////B/7/////BwAAAAAAAAAAAAAA8B9+AAA8A////////////////////////////////////////6MgAAAA/wAAAAAAAAAAgAMAAAAAAABA8P//////////////D/7/////DwAAAAAAAAAAAAAAgB8eAADOABj/////////////////////////////////////fwgAAACA/w+AAAAAAAAAAEwAAAAAAADg////////////////AfD///9/AQAAAAAAAAAAAAAAAMIfAAD2IQD8/////////////////////////////////////wAAAACA/w8AAAAAAAAAAPAAAAAAAABg/v////////////8HAMD///9/AAAAAAAAAAAAAAAAAMgPAAAPDQD8/////////////////////////////////////wMAAACA/w8AAAAAAAAAAIAHAAAAAACk//////////////8AAIb///8fAAAAAAAAAAAAAAAAAOAHAAA//AD8/////////////////////////////////////w8AAAAA/38AAAAAAAAAAAAcAAAAAACM/////////////38AAID///8fAAAAAAAAAAAAAAAAAPAHAAAe/gP8/////////////////////////////////////x8AAAAA/z8AAAAAAAAAAAB4OAAAAADr////////////fwAAAID///8PAAAAAAAAAAAAAAAAAPgPAAAY/xE4/v///////////////////////////////////z8AAAAA/D8AAAAAAAAAAADgcQAAAADp////////////fwAAAMD///8PAAAAAAAAAAAAAAAAAOAAAACA/yEA/v////////////////////////////////////8AAAAA/D8AAAAAAAAAAADgzwAAAAD7////////////PwAAAOD///8DAAAAAAAAAAAAAAAAAOQBAOCB/wEQ/v////////////////////////////////////8BAAAA4A8AAAAAAAAAABDaHwAAAHD/////////////FwAAAPj/b/gDAAAAAAAAAAAAAAAAAAAAAPjH/wOA//////////////////////////////////////8PAAAAgJ8AAAAAAAAAAPD/DwMAAPz/////////////AwAAAPD/H+ABAAAAAAAAAAAAAAAAAAAAAPTf/x+A//////////////////////////////////////8fEAA/AD8AAAAAAAAAAPD/Pw8AwP7/////////////AwAAAOD/H+AAAAAAAAAAAAAAAAAAAAAAAPT//z8AAP7///////////////////////////////////////8fAHwAAAAAAAAAnP//f/6D////////////////BwAAAOD/n0AAAAAAYAMAAAAAAAAAAAAgAPz//5/wB/z///////////////////////////////////////8/APAnEAAAAAAAQP7//374////////////////BwAAAOD/HwAAAAAA8QcAAAAAAAAAAAAAAPz//wf4////////////////////////////////////////////AMH/fwAAAAAA4P////P/////////////////DwAAAOD/AQAAAACA/wcAAAAAAAAAAAAAAPz//wP4////////////////////////////////////////////AQf//wEAAAAA8P//////////////////////HwAAAPH/AAAAAADg/wcAAAAAAAAAAAAAAPz//wf4////////////////////////////////////////////Bz7//w8AAAAA4P//////////////////////PwAAAvE7gA8AAADg/wcAAAAAAAAAAAQAAPj//wf4/////////////////////////////////////////////z////8AAAAAwP//////////////////////fwAADgAA5CMAAAD4/w8AAAAAAAAAAAAAAMD//w/8//////////////////////////////////////////////////97AAB4APj//////////////////////wcgABgA/jwAAAD8/z8AAAAAAAAAAAAAAAD//z/w//////////////////////////////////////////////////8/AAAAAMD/////////////////////fw/8eACA/38AAAD+/38AAAAAgB8AAAAAAAD6///B//////////////////////////////////////////////////8fAAAAAMD////////////////////////4H0DA/x8AAAD+/18AAAAA8P8BAAAAAADg//8D////8P////////////////////////////////////////////8fADgA+M/////////////////////////5B/D7/xcAAADx/38AAAAA+f8PAAAAAACA//8D/v8/Pv///////////////////////////////////////////789AX8A+P/////////////////////////xAOD//8MBAID///8AAAAA+P8fAAAAAAAA/P8H+P8fAP//////////////////////////////////////////////+f8H/v///////////////////////893AADg/+AHAMD9//8fAAAAnv8HAAAAAAAA/v8f/v8/AP7//////////////////////////////////////////////f8P8MD///////////////////////9PAAD4//kHAOD////vAQAADIADAAAAAAAA9P////8P/HD///////////////////////////////////////////////MBAPj//////////////////v////9/DwDA//8fAMD/////DwAAAAAAAAAAAAAA+P/////z/wP+//////9z/P///////////////////////////////////wMAAP///////////////////v/////9H0AA//8DAPD/////HwAAAAAAAAAAAAAAgP///////wMH////////8P///////////////////////////////////wEAgP///////////////wcf/8fN/v/4D+CD/38AACD9////PwAAAAAAAAAAAAAAwP///////wEH/P//////w///////////////////////////////////HwAA8P///////////////wOAOQB4+H/0B4Dj/wsAAID+/////w8AAAAAAAAAAAAAKP//////PwAP4Nf/////4/f/////////////////////////////////AwAA8P///////////////+c/HBD44ffAH4D4fwAAAAD8//////8PAAAAAAAAAAAA4Pn/////BwAAAgxw/j/84/v///////////////////////////v/////AAAAAP7//////wd/////A/D/+w/46CPgHyT+/wcAAAD8//////8/AAAAAAAAAAAAAPz///9fAAAADgAA/gP/8f//////////////////////////////wf9/AAAAAPz/////HwAA90ccwP///zcYfgDggMH//wIAAPz6////////AQAAAAAAAAAAAGD//7cDAAAAAACAH8D/+f///////////////////////////wAA5/8BAAAAAOD///8AAAAAAAIAAL7//x+A/wH4//v/nwAAANj///////9zAAAAAAAAAAAAAACw+z8AAAAAAABgAMD/8f/f/////////////////////////wAAAAAAAAAAAAD9fwAAAAAAAAAA8P///wCAf8D/////OwAAADj+//////8eHwAAAAAAAAAAAABA1gYAAAAAAOAHAID/8f+/////////////////////////fwAAAAAAHwAAAADAAAAAAAAAAAAOwP//fwCAP4Cf////AwAAAND///////+fHwAAAAAAAAAAAAAAAAAAAAAAAPoAAMD/+fDf//////////////8H//f//38AAAAAAADAAAAAAAAAAAAAAAAAAIB//P//fgA+DvDv//8TAAAAAN7/////////DwAAAAAAAAAAAAAAAAAAAAAAgH8AAAD+ef+n//////////////8HAoD/8wMAAAAAAAAAAAAAAAAAAAAAAAAAAOD/8f9/P8B/DPDHP+8DAAAAAP7/////////DAAAAAAAAAAAAAAAAAAAAAAAAH4AAAD+QfDw//////////////8GAMD//AMAAAAAAAAAAAAAAAAAAAAAAAAAAMD/9+cxH5g/juDnfwAAAAAAAPv////////3DwAAAAAAAAAAAAAAAAAAAAAAAH4AAAD8QUD+//////////v///8DAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAID/fw4AcYAP/sHPv38AAAAAAP7////////nAQAAAAAAAAAAAAAAAAAAAAAAAPgAAABwAAD+7/////8P//8fgP8BAABgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAAMMA//Ac+QAAAAAAAAP/////////ffwAAAAAAAAAAAAAAAAAAAAAAAPAHAAAAAAAAuv//////2QQAAAAAAAA8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAID/GAAAAAAAAAAAAAAAAAAAgP///////////wAAAAAAAAAAAAAAAAAAAAAAAMAfAAAAAAAA4P//////DwMAAAAAAAACAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPAHAAAAHP///QAAAAAAwP//////////vwEAAAAAAAAAAAAAAAAAAAAAAAD/AAAAAAAA0P///////wAAAAAAAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4P//zwEPn////wEAAAAA8P//////////fw0AAAAAAAAAAAAAAAAAAAAAAAD8AwAAAAAAAP7//////wcAAAAAAPzf8wUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAzP/BH/gPAD8APwAAAAAA/P///////////wEAAAAAAAAAAAAAAAAAAAAAAADg/wEAAAAAAAD+/////w0AAAAAgPj9AQAAAAAAAAAAAAAAAAAAAAAAAAAAAAD4Ay/wALYfwD8AwAAAwH/5////////////fwQAAAAAAAAAAAAAAAAAAAAAAAAAzP8AAAAAAACAg////wUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACA/xhgAADAP/j//w8A4P//////////////FwAAAAAAAAAAAAMAAAAAAAAAAAAAAPADAAAAAAAAAPw/AAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/gEAYAAAAAj8bwAAwP///////////////wUAAAAAAAAA4AcAAAAAAAAAAAAAAAAAAAAAAAQAAPgHAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMgPADgAHwDv/w8A+P///////////////xEAAAAAAAAAAB/4AwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAODxAVf+//+B////////////////HwIAAAAAAAAAhD8cAAAAAAAAAAAAAAAAAAAAAAAAgD8QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP444P/9//8H8P//////////////PwAAAAAAAAAg//8HAAAAAAAAAAAAAAAAAAAAAAAAAP4DAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4AMAgP+///8BAOD//////////////wMAAAAAAABAfz/AAAAAAAAAAAAAAAAAAAAAAADgPzgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA///zz//fAcD//////////////wwAAAAAAADgL8/8HwAAAAAAAAAAAAAAAAAAAADz/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/7/5/P//D/z//////////////30AAAAAAAAAAEAjBwAAAADAA08bAAAAAAAAAAD/AwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/IP7f/j/f+D///////////////8HAAAAAAAAAAAAAAAAAABgfeCHzwEAAAAAAAD8DwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA8MDP//f//x/A////////////z/9/AAAAAAAAAAAAAAAAAAAAAIAPAAAAAAAAAADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP7//////3/A9/////////9/PoAfAAAAAAAAAAAAAAAAAAAAAAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADw8f////8fAE74sP////8PAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQD7///kBAAAA4OP/////DwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMb5//8PAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
  const DOT_STEP = 1.1;                 // degrees between land dots
  const PARALLEL_STEP = 5;              // degrees between ocean latitude lines
  const MERIDIAN_STEP = 10;             // degrees between ocean longitude lines

  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const RAD = Math.PI / 180;
  const unit = (lat, lon) => [Math.cos(lat * RAD) * Math.sin(lon * RAD), Math.sin(lat * RAD), Math.cos(lat * RAD) * Math.cos(lon * RAD)];

  // ---------- land dots and ocean lines ----------
  const rasterBytes = Uint8Array.from(atob(RASTER), (ch) => ch.charCodeAt(0));
  const RCOLS = 360 / RASTER_RES, RROWS = 180 / RASTER_RES;
  function isLand(lat, lon) {
    const r = clamp(Math.floor((lat + 90) / RASTER_RES), 0, RROWS - 1);
    const c = ((Math.floor((lon + 180) / RASTER_RES) % RCOLS) + RCOLS) % RCOLS;
    const i = r * RCOLS + c;
    return (rasterBytes[i >> 3] & (1 << (i & 7))) !== 0;
  }

  // Dense dots on land: rows of latitude, evenly spaced along each row.
  const landDots = [];
  for (let lat = -90 + DOT_STEP / 2; lat < 90; lat += DOT_STEP) {
    const n = Math.max(1, Math.round((360 * Math.cos(lat * RAD)) / DOT_STEP));
    for (let k = 0; k < n; k++) {
      const lon = -180 + ((k + 0.5) * 360) / n;
      if (isLand(lat, lon)) landDots.push(unit(lat, lon));
    }
  }

  // Thin parallels and meridians, kept only where they cross open water.
  const oceanSegs = [];
  const addSeg = (lat1, lon1, lat2, lon2) => {
    if (!isLand(lat1, lon1) && !isLand(lat2, lon2)) oceanSegs.push(unit(lat1, lon1), unit(lat2, lon2));
  };
  for (let lat = -75; lat <= 80; lat += PARALLEL_STEP)
    for (let lon = -180; lon < 180; lon += 1) addSeg(lat, lon, lat, lon + 1);
  for (let lon = -180; lon < 180; lon += MERIDIAN_STEP)
    for (let lat = -80; lat < 80; lat += 1) addSeg(lat, lon, lat + 1, lon);

  // ---------- nodes at real city positions ----------
  // side/dy: which way the label opens and how far it shifts, so close cities don't print on top of each other.
  const CITIES = [
    ["Sydney", -33.87, 151.21, "r", 0], ["London", 51.51, -0.13, "l", -16], ["Dubai", 25.2, 55.27, "r", 0],
    ["Paris", 48.86, 2.35, "l", 16], ["Toronto", 43.65, -79.38, "r", -8], ["Tokyo", 35.68, 139.69, "r", 0],
    ["Berlin", 52.52, 13.4, "r", 0], ["Seoul", 37.57, 126.98, "l", 0], ["New York", 40.71, -74.01, "r", 12],
    ["Shanghai", 31.23, 121.47, "l", 14],
  ];
  const POINTS = [
    [1.35, 103.82], [19.08, 72.88], [-23.55, -46.63], [34.05, -118.24], [19.43, -99.13], [30.04, 31.24],
    [6.52, 3.38], [-26.2, 28.05], [55.76, 37.62], [41.01, 28.98], [64.15, -21.94], [61.22, -149.9],
    [22.32, 114.17], [13.76, 100.5], [-6.2, 106.85], [-36.85, 174.76], [-34.6, -58.38], [-12.05, -77.04],
    [41.88, -87.63], [49.28, -123.12], [-1.29, 36.82], [28.61, 77.21],
  ];
  const nodes = [
    ...CITIES.map(([name, lat, lon, side, dy]) => ({ name, side, dy, v: unit(lat, lon), city: true })),
    ...POINTS.map(([lat, lon]) => ({ name: "", side: "r", dy: 0, v: unit(lat, lon), city: false })),
  ];

  const byName = (name) => nodes.findIndex((n) => n.name === name);
  const AMBER_EDGES = [
    ["Sydney", "Tokyo"], ["London", "Paris"], ["Paris", "Toronto"], ["Seoul", "Shanghai"],
    ["London", "Dubai"], ["Tokyo", "Seoul"], ["Berlin", "Dubai"], ["New York", "Toronto"],
  ].map(([a, b]) => [byName(a), byName(b)]);

  // Thin white web: every node links to its two nearest neighbours on the sphere.
  const angle = (a, b) => Math.acos(clamp(a[0] * b[0] + a[1] * b[1] + a[2] * b[2], -1, 1));
  const edgeKey = (a, b) => (a < b ? a + "-" + b : b + "-" + a);
  const edges = new Map();
  AMBER_EDGES.forEach(([a, b]) => edges.set(edgeKey(a, b), { a, b, amber: true }));
  nodes.forEach((n, i) => {
    nodes
      .map((m, j) => ({ j, d: angle(n.v, m.v) }))
      .filter((o) => o.j !== i)
      .sort((u, v) => u.d - v.d)
      .slice(0, 2)
      .forEach(({ j }) => { if (!edges.has(edgeKey(i, j))) edges.set(edgeKey(i, j), { a: i, b: j, amber: false }); });
  });

  // Each edge is a great-circle arc lifted off the surface; sample it once, rotate the samples every frame.
  const edgeList = [...edges.values()].map((e) => {
    const A = nodes[e.a].v, B = nodes[e.b].v, om = angle(A, B), so = Math.sin(om);
    const lift = 0.015 + 0.08 * (om / Math.PI);
    const pts = [];
    for (let s = 0; s <= ARC_STEPS; s++) {
      const f = s / ARC_STEPS;
      const ka = Math.sin((1 - f) * om) / so, kb = Math.sin(f * om) / so;
      const r = 1 + lift * Math.sin(Math.PI * f);
      pts.push([(A[0] * ka + B[0] * kb) * r, (A[1] * ka + B[1] * kb) * r, (A[2] * ka + B[2] * kb) * r]);
    }
    return { ...e, pts };
  });

  // ---------- HUD readouts ----------
  const stats = { tokens: 1332, temp: 0.73, context: 133, accuracy: 97.5 };
  let lastStat = 0;
  function stepStats() {
    stats.tokens = Math.round(clamp(stats.tokens + rand(-60, 60), 980, 1420));
    stats.temp = clamp(stats.temp + rand(-0.04, 0.04), 0.68, 0.94);
    stats.context = Math.round(clamp(stats.context + rand(-3, 3), 118, 138));
    stats.accuracy = clamp(stats.accuracy + rand(-0.4, 0.4), 96.0, 99.4);
  }

  // ---------- projection ----------
  let w = 0, h = 0, dpr = 1, scale = 1, cx = 0, cy = 0, R = 0;
  let cosL = 1, sinL = 0;
  const cosT = Math.cos(TILT), sinT = Math.sin(TILT);
  // Spin about the polar axis, lean the pole toward the viewer, then project orthographically.
  function project(p, out) {
    const x = p[0] * cosL + p[2] * sinL;
    const z0 = -p[0] * sinL + p[2] * cosL;
    const y = p[1] * cosT - z0 * sinT;
    const z = p[1] * sinT + z0 * cosT;
    out[0] = cx + x * R; out[1] = cy - y * R; out[2] = z;
    out[3] = z >= 0 || x * x + y * y > 1;   // hidden only when behind the ball
    return out;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale = clamp(Math.min(w, h) / 760, 0.62, 1.35);
    cx = w / 2; cy = h / 2;
    R = Math.min(w, h) * GLOBE_SIZE;
  }

  function drawGrid() {
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = (w % GRID_STEP) / 2; x < w; x += GRID_STEP) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, h); }
    for (let y = (h % GRID_STEP) / 2; y < h; y += GRID_STEP) { ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(w, Math.round(y) + 0.5); }
    ctx.stroke();
  }

  function drawHud() {
    const m = Math.max(18, 26 * scale);
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLORS.hud;
    ctx.font = `600 ${Math.round(15 * scale)}px ${FONT}`;
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";
    ctx.fillText(`TOKENS: ${stats.tokens.toLocaleString("en-US")}`, m, m + 14 * scale);
    ctx.fillText(`CONTEXT: ${stats.context}K`, m, h - m);
    ctx.textAlign = "right";
    ctx.fillText(`TEMP: ${stats.temp.toFixed(2)}`, w - m, m + 14 * scale);
    ctx.fillText(`ACCURACY: ${stats.accuracy.toFixed(1)}%`, w - m, h - m);
  }

  const tmp = [0, 0, 0, true], prev = [0, 0, 0, true];

  function frame(now) {
    const t = now / 1000;
    const lon = START_LON * RAD + (t / SPIN_PERIOD) * Math.PI * 2;
    cosL = Math.cos(-lon); sinL = Math.sin(-lon);
    if (t - lastStat > STAT_INTERVAL) { stepStats(); lastStat = t; }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, w, h);
    drawGrid();

    // Globe rim.
    ctx.strokeStyle = COLORS.line;
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();

    // Ocean lines: front side only, brighter toward the centre (three depth bands keep it to three strokes).
    ctx.lineWidth = 0.6;
    ctx.strokeStyle = COLORS.land;
    const bands = [new Path2D(), new Path2D(), new Path2D()];
    for (let s = 0; s < oceanSegs.length; s += 2) {
      project(oceanSegs[s], prev);
      project(oceanSegs[s + 1], tmp);
      if (prev[2] < 0 || tmp[2] < 0) continue;
      const band = bands[Math.min(2, Math.floor(((prev[2] + tmp[2]) / 2) * 3))];
      band.moveTo(prev[0], prev[1]); band.lineTo(tmp[0], tmp[1]);
    }
    bands.forEach((band, b) => { ctx.globalAlpha = 0.07 + b * 0.07; ctx.stroke(band); });

    // Land dots: the far side shows through faintly, the near side brightens toward the centre.
    const dot = Math.max(1, 1.35 * scale);
    ctx.fillStyle = COLORS.land;
    for (const p of landDots) {
      project(p, tmp);
      ctx.globalAlpha = tmp[2] < 0 ? 0.06 : 0.25 + 0.6 * tmp[2];
      ctx.fillRect(tmp[0] - dot / 2, tmp[1] - dot / 2, dot, dot);
    }

    // Arcs: draw only the stretches in front of the ball.
    ctx.lineWidth = 1;
    for (const e of edgeList) {
      ctx.strokeStyle = e.amber ? COLORS.amberLine : COLORS.line;
      ctx.globalAlpha = 1;
      ctx.beginPath();
      project(e.pts[0], prev);
      for (let s = 1; s < e.pts.length; s++) {
        project(e.pts[s], tmp);
        if (prev[3] && tmp[3]) { ctx.moveTo(prev[0], prev[1]); ctx.lineTo(tmp[0], tmp[1]); }
        prev[0] = tmp[0]; prev[1] = tmp[1]; prev[2] = tmp[2]; prev[3] = tmp[3];
      }
      ctx.stroke();
    }

    // Nodes and their live screen coordinates; they fade out as they turn past the rim.
    const small = Math.round(10.5 * scale), mid = Math.round(12.5 * scale);
    for (const n of nodes) {
      project(n.v, tmp);
      const a = clamp(tmp[2] * 6, 0, 1);
      if (a <= 0) continue;
      const sx = tmp[0], sy = tmp[1];
      const coords = `${Math.round((sx / w) * SPACE_W)}, ${Math.round((sy / h) * SPACE_H)}`;
      const left = n.side === "l", down = n.dy * scale;
      ctx.textAlign = left ? "right" : "left";
      const tx = sx + (left ? -9 : 9) * scale;
      if (n.city) {
        ctx.globalAlpha = a;
        ctx.fillStyle = COLORS.amber;
        ctx.beginPath(); ctx.arc(sx, sy, 4.2 * scale, 0, Math.PI * 2); ctx.fill();
        ctx.textBaseline = "alphabetic";
        ctx.font = `500 ${small}px ${FONT}`;
        ctx.fillText(n.name, tx, sy - 6 * scale + down);
        ctx.textBaseline = "top";
        ctx.font = `600 ${mid}px ${FONT}`;
        ctx.fillText(coords, tx, sy - 3 * scale + down);
      } else {
        const s = 5 * scale;
        ctx.globalAlpha = a;
        ctx.fillStyle = COLORS.node;
        ctx.fillRect(sx - s / 2, sy - s / 2, s, s);
        ctx.textBaseline = "middle";
        ctx.font = `500 ${small}px ${FONT}`;
        ctx.globalAlpha = a * 0.75;
        ctx.fillText(coords, tx, sy + 1);
      }
    }

    drawHud();
    if (!reduceMotion) requestAnimationFrame(frame);
  }

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { resize(); if (reduceMotion) frame(0); }, 120);
  });

  resize();
  // Redraw once the web font arrives so the first frames never stick with the fallback.
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(frame));
})();
