<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sairyu Helix</title>
<style>
  /* Layout: one portrait 1080×1776 canvas scaled to fit the window; a 10-second generative DNA sequence on loop */
  :root {
    --page: #050608;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--page); display: grid; place-items: center; overflow: hidden; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: 100vh; aspect-ratio: 1080 / 1776; }
</style>
</head>
<body>

<canvas id="helix" width="1080" height="1776" role="img" aria-label="DNA 이중나선이 입자, 박스, 좌표 숫자와 함께 여러 형태로 빠르게 바뀌는 10초 그래픽"></canvas>

<script>
(() => {
  const W = 540, H = 888, SCALE = 2, FPS = 30, LENGTH = 10;   // drawing space, pixel density (→ 1080×1776), frame rate, loop seconds
  const canvas = document.getElementById("helix");
  const ctx = canvas.getContext("2d");

  const BG = { dark: "#07080b", cream: "#f2ece2", light: "#e4e4e8", navy: "#090b22" };
  const GLOW = ["#f6b9d8", "#cbb8ff", "#3fc8c8", "#2a9ea6", "#3b5cff", "#2b3fc0", "#ffd56e", "#f5f2ff"];
  const INK = ["#1d3550", "#b8396a", "#d4a238", "#2c6b5d", "#142033", "#7a4f9a"];
  const GLYPHS = "01+×·◦#=*%8o:x".split("");

  // ---------- seeded randomness so every frame renders the same way twice ----------
  function rngFrom(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];

  // ---------- pre-rendered sprites ----------
  function sprite(w, h, draw) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    draw(c.getContext("2d"));
    return c;
  }
  const glyphSprites = (color) => GLYPHS.map((g) => sprite(16 * SCALE, 18 * SCALE, (g2) => {
    g2.scale(SCALE, SCALE);
    g2.fillStyle = color; g2.font = "600 14px ui-monospace, Menlo, Consolas, monospace";
    g2.textAlign = "center"; g2.textBaseline = "middle"; g2.fillText(g, 8, 9);
  }));
  const GLYPH = { light: glyphSprites("#e9e9f0"), dark: glyphSprites("#3b3a40") };
  const softDot = (color) => sprite(64, 64, (g) => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, color); gr.addColorStop(0.45, color + "cc"); gr.addColorStop(1, color + "00");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
  const GLOW_SPRITES = GLOW.map(softDot);
  const INK_SPRITES = INK.map(softDot);
  // Blurry thumbnails that sit inside the blue detection boxes.
  const BOX_TEX = Array.from({ length: 8 }, (_, i) => {
    const r = rngFrom(900 + i);
    const tiny = sprite(5, 5, (g) => {
      for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) { g.fillStyle = pick(r, GLOW.concat(["#1b2a8a", "#0d1440"])); g.fillRect(x, y, 1, 1); }
    });
    return sprite(80, 80, (g) => { g.imageSmoothingEnabled = true; g.drawImage(tiny, 0, 0, 80, 80); });
  });

  // ---------- looks ----------
  // turns: helix turns over the height, amp: swing as a share of width, band: strand thickness,
  // ribbon: the two strands run close together like one twisted ribbon, tilt: lean that turns the coils into loops.
  const BASE = { bg: "dark", turns: 2, amp: 0.3, band: 24, rungs: true, labels: true, particles: 1.0, boxes: 0.12,
    tilt: 0, ribbon: false, glow: false, alpha: 1, strands: true, scatter: false, glyphField: false, speed: 1.3 };
  const LOOK = {
    helix:      {},
    helixBusy:  { particles: 1.6, boxes: 0.2 },
    creamRungs: { bg: "cream", turns: 3.3, amp: 0.21, band: 16, labels: false, particles: 0, boxes: 0 },
    creamZig:   { bg: "cream", turns: 2.4, amp: 0.34, band: 70, ribbon: true, rungs: false, labels: false, particles: 0, boxes: 0 },
    zig:        { turns: 4.6, amp: 0.33, band: 44, ribbon: true, glow: true, rungs: false, particles: 0.55, boxes: 0.03 },
    zigBoxes:   { turns: 4.6, amp: 0.33, band: 44, ribbon: true, glow: true, rungs: false, particles: 0.5, boxes: 0.35 },
    wide:       { turns: 1.05, amp: 0.27, band: 150, ribbon: true, glow: true, rungs: false, particles: 0.45, boxes: 0.1 },
    wideBoxes:  { turns: 1.05, amp: 0.27, band: 150, ribbon: true, glow: true, rungs: false, particles: 0.35, boxes: 0.6 },
    scatter:    { scatter: true, particles: 2.4, boxes: 0.12 },
    scatterBox: { scatter: true, particles: 1.8, boxes: 0.5 },
    lightScatter: { bg: "light", scatter: true, particles: 1.3, boxes: 0 },
    lightHelix: { bg: "light", turns: 1.05, amp: 0.3, band: 18, labels: false, rungs: false, particles: 1.0, boxes: 0 },
    lightWide:  { bg: "light", turns: 1.05, amp: 0.27, band: 150, ribbon: true, rungs: false, labels: false, particles: 0.7, boxes: 0.5 },
    dim:        { turns: 3, amp: 0.27, band: 18, particles: 0.35, boxes: 0, alpha: 0.38 },
    dimmer:     { scatter: true, glyphField: true, particles: 0, boxes: 0, alpha: 0.16 },
    wire:       { turns: 1.5, amp: 0.31, band: 22, particles: 0, boxes: 0 },
    wireTight:  { turns: 4.2, amp: 0.2, band: 14, particles: 0, boxes: 0, labels: false },
    wireNavy:   { bg: "navy", turns: 1.5, amp: 0.31, band: 22, particles: 0, boxes: 0 },
    rings:      { turns: 3.2, amp: 0.33, band: 20, tilt: 0.62, rungs: false, particles: 0.9, boxes: 0.18 },
    boxRows:    { strands: false, particles: 0.25, boxes: 0.9, labels: false },
    creamField: { bg: "cream", scatter: true, glyphField: true, particles: 0, boxes: 0 },
  };

  // ---------- the 10-second cut list (start time in seconds → look) ----------
  const CUTS = [
    [0.0, "scatterBox"], [0.2, "scatter"], [0.4, "helix"], [0.6, "helixBusy"], [0.9, "creamRungs"],
    [1.2, "creamZig"], [1.4, "zig"], [1.6, "scatter"], [1.8, "zig"], [1.9, "wide"], [2.1, "helix"],
    [2.4, "rings"], [2.5, "zig"], [2.9, "scatter"], [3.1, "lightScatter"], [3.4, "helixBusy"],
    [3.9, "dim"], [4.2, "dimmer"], [4.7, "scatter"], [4.9, "helix"], [5.0, "lightHelix"],
    [5.2, "lightWide"], [5.4, "wide"], [5.6, "wireTight"], [5.9, "zigBoxes"], [6.2, "scatter"],
    [6.4, "wire"], [6.9, "rings"], [7.4, "scatterBox"], [7.5, "boxRows"], [7.9, "wireNavy"],
    [8.1, "helixBusy"], [8.4, "rings"], [8.8, "creamField"], [9.3, "scatter"], [9.4, "wideBoxes"],
    [9.9, "zig"],
  ];

  // ---------- helix geometry ----------
  function strandPoint(L, k, y, phase) {
    const th = (y / H) * L.turns * Math.PI * 2 + phase + k * (L.ribbon ? Math.PI * 0.22 : Math.PI);
    const ampPx = L.amp * W;
    const z = Math.cos(th);
    return {
      x: W / 2 + ampPx * Math.sin(th),
      y: y + L.tilt * ampPx * 0.5 * z,
      z,
      // slope of the strand, used to lay glyphs across it
      dx: ampPx * Math.cos(th) * (L.turns * Math.PI * 2) / H,
    };
  }

  function drawGlyph(set, r, x, y, a) {
    ctx.globalAlpha = a;
    ctx.drawImage(pick(r, set), x - 8, y - 9, 16, 18);
  }

  function drawStrands(L, phase, r, inkSet, light) {
    const step = L.ribbon ? 9 : 7;
    for (let k = 0; k < 2; k++) {
      for (let y = -60; y < H + 60; y += step) {
        const p = strandPoint(L, k, y, phase);
        const depth = 0.35 + 0.65 * (p.z + 1) / 2;
        const len = Math.hypot(p.dx, 1);
        const nx = 1 / len, ny = -p.dx / len;   // across the strand
        const n = Math.max(2, Math.round(L.band / 8));
        if (L.glow && !light && r() < 0.18) {
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = 0.16 * Math.min(1, 40 / L.band) * depth * L.alpha;
          const s = L.band * 1.6;
          ctx.drawImage(pick(r, [GLOW_SPRITES[0], GLOW_SPRITES[1], GLOW_SPRITES[7]]), p.x - s / 2, p.y - s / 2, s, s);
          ctx.globalCompositeOperation = "source-over";
        }
        for (let j = 0; j < n; j++) {
          if (r() < 0.25) continue;
          const o = (j / (n - 1) - 0.5) * L.band;
          drawGlyph(inkSet, r, p.x + nx * o, p.y + ny * o, depth * L.alpha * (light ? 0.8 : 0.85));
        }
      }
    }
  }

  function drawRungs(L, phase, r, light, t) {
    ctx.fillStyle = light ? "#4a4850" : "#dcdce6";
    ctx.font = "500 13px ui-monospace, Menlo, Consolas, monospace";
    for (let y = 10; y < H; y += 22) {
      const a = strandPoint(L, 0, y, phase), b = strandPoint(L, 1, y, phase);
      const depth = 0.5 + 0.5 * Math.abs(a.z - b.z) / 2;
      ctx.globalAlpha = 0.75 * depth * L.alpha;
      const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x);
      for (let x = x0 + 10; x < x1 - 10; x += 7) ctx.fillRect(x, y - 1, 2.2, 2.2);
      if (L.labels && x1 - x0 > 60) {
        ctx.globalAlpha = 0.6 * L.alpha;
        ctx.textAlign = "right"; ctx.fillText(String(Math.floor(r() * 300)), x0 - 4, y + 4);
        ctx.textAlign = "left"; ctx.fillText(String(Math.floor(r() * 300)), x1 + 4, y + 4);
      }
    }
    if (!L.labels) return;
    // Running "Life / ID" readouts down one strand.
    ctx.textAlign = "right";
    ctx.font = "500 15px ui-monospace, Menlo, Consolas, monospace";
    for (let y = 30; y < H; y += 44) {
      const p = strandPoint(L, 0, y, phase);
      if (p.z < -0.2) continue;
      ctx.globalAlpha = 0.7 * L.alpha;
      const life = (0.4 + 0.5 * Math.abs(Math.sin(y * 0.01 + t * 2))).toFixed(3);
      ctx.fillText(`Life:${life}`, p.x - 16, y);
      ctx.fillText(`ID: ${Math.floor(y / 44)}`, p.x - 16, y + 16);
    }
  }

  // ---------- particles ----------
  function drawBlob(x, y, size, sprites, r, a) {
    ctx.globalAlpha = a;
    ctx.drawImage(pick(r, sprites), x - size / 2, y - size / 2, size, size);
  }
  function drawBurst(x, y, size, r, a, light) {
    const rays = 12 + Math.floor(r() * 20);
    ctx.strokeStyle = light ? "#2a3550" : pick(r, ["#f2eeff", "#9fe6ff", "#f8c7e2"]);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = a * 0.75;
    ctx.beginPath();
    for (let i = 0; i < rays; i++) {
      const ang = r() * Math.PI * 2, len = size * (0.3 + r() * 0.9);
      ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    }
    ctx.stroke();
    for (let i = 0; i < rays / 2; i++) {
      const ang = r() * Math.PI * 2, len = size * (0.4 + r() * 0.9);
      ctx.fillRect(x + Math.cos(ang) * len, y + Math.sin(ang) * len, 2.5, 2.5);
    }
  }
  function drawMolecule(x, y, size, r, a, light) {
    const col = light ? pick(r, INK) : pick(r, ["#ffd56e", "#f6b9d8", "#f5f2ff", "#cbb8ff"]);
    ctx.globalAlpha = a;
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 2;
    const n = 3 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++) {
      const ang = r() * Math.PI * 2, d = size * 0.55;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang) * d, y + Math.sin(ang) * d); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + Math.cos(ang) * d, y + Math.sin(ang) * d, size * (0.14 + r() * 0.1), 0, Math.PI * 2); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y, size * 0.32, 0, Math.PI * 2); ctx.fill();
  }
  function drawBox(x, y, size, r, a, light) {
    ctx.globalAlpha = a;
    ctx.drawImage(pick(r, BOX_TEX), x - size / 2, y - size / 2, size, size);
    ctx.globalAlpha = Math.min(1, a + 0.2);
    ctx.strokeStyle = light ? "#c79a1e" : "#4d7bff";
    ctx.lineWidth = 2;
    ctx.strokeRect(x - size / 2, y - size / 2, size, size);
    if (light) { ctx.strokeStyle = "#ffd23a"; ctx.lineWidth = 3; ctx.strokeRect(x - size / 2 + 3, y - size / 2 + 3, size - 6, size - 6); }
  }

  function drawParticles(L, phase, seedR, frameR, light, local) {
    const count = Math.round(L.particles * 80);
    const boxCount = Math.round(L.boxes * 26);
    const sprites = light ? INK_SPRITES : GLOW_SPRITES;
    // Particles gather in clumps, the way the reference bunches its cells.
    const anchors = Array.from({ length: L.scatter ? 16 : 9 }, () => [30 + seedR() * (W - 60), seedR() * H, seedR() < 0.5 ? 0 : 1]);
    const pos = () => {
      const [ax, ay, k] = pick(seedR, anchors);
      const spread = L.scatter ? 46 : 70;
      if (L.scatter || !L.strands) return { x: ax + (seedR() - 0.5) * spread * 2, y: ay + (seedR() - 0.5) * spread * 2, z: 1 };
      const p = strandPoint(L, k, ay + (seedR() - 0.5) * spread * 2, phase);
      const j = (seedR() - 0.5) * L.band * 1.4;
      return { x: p.x + j, y: p.y + (seedR() - 0.5) * 14, z: p.z };
    };
    if (!light) ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < count; i++) {
      const p = pos();
      const kind = seedR();
      const size = 16 + seedR() * 44;
      const pulse = 0.85 + 0.3 * Math.sin(local * 9 + i);
      const a = (0.4 + 0.6 * (p.z + 1) / 2) * L.alpha;
      if (kind < 0.42) drawBlob(p.x, p.y, size * pulse, sprites, seedR, a * 0.9);
      else if (kind < 0.75) { ctx.globalCompositeOperation = "source-over"; drawBurst(p.x, p.y, size * 1.1 * pulse, frameR, a, light); if (!light) ctx.globalCompositeOperation = "lighter"; }
      else { ctx.globalCompositeOperation = "source-over"; drawMolecule(p.x, p.y, size * 0.7, seedR, a * 0.9, light); if (!light) ctx.globalCompositeOperation = "lighter"; }
    }
    ctx.globalCompositeOperation = "source-over";
    for (let i = 0; i < boxCount; i++) {
      const p = pos();
      drawBox(p.x, p.y, 18 + seedR() * 40, seedR, (0.55 + 0.45 * (p.z + 1) / 2) * L.alpha, light);
    }
  }

  // Scattered short rungs and glyph clusters for the looks without a helix.
  function drawScatterRows(L, r, light) {
    ctx.fillStyle = light ? "#4a4850" : "#dcdce6";
    ctx.font = "500 13px ui-monospace, Menlo, Consolas, monospace";
    for (let y = 20; y < H; y += 30 + r() * 26) {
      if (r() < 0.3) continue;
      const x0 = 60 + r() * W * 0.4, x1 = x0 + 80 + r() * W * 0.5;
      ctx.globalAlpha = 0.55 * L.alpha;
      for (let x = x0; x < Math.min(x1, W - 60); x += 7) ctx.fillRect(x, y, 2.2, 2.2);
      ctx.textAlign = "right"; ctx.fillText(String(Math.floor(r() * 300)), x0 - 4, y + 5);
    }
  }
  function drawGlyphField(L, r, inkSet) {
    const clusters = 70;
    for (let c = 0; c < clusters; c++) {
      const cx = r() * W, cy = r() * H, cols = 2 + Math.floor(r() * 7), rows = 2 + Math.floor(r() * 6);
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        if (r() < 0.3) continue;
        drawGlyph(inkSet, r, cx + i * 11, cy + j * 13, (0.5 + r() * 0.5) * (L.bg === "cream" ? 0.9 : L.alpha));
      }
    }
  }

  // Thin horizontal glitch lines that flicker every frame.
  function drawScanlines(r, light) {
    ctx.globalAlpha = 1;
    for (let i = 0; i < 7; i++) {
      ctx.fillStyle = light ? `rgba(40,40,60,${0.03 + r() * 0.06})` : `rgba(200,210,255,${0.04 + r() * 0.16})`;
      ctx.fillRect(0, Math.floor(r() * H), W, 1 + Math.floor(r() * 2));
    }
  }

  // ---------- one frame ----------
  function render(t) {
    t = ((t % LENGTH) + LENGTH) % LENGTH;
    let ci = 0;
    while (ci + 1 < CUTS.length && CUTS[ci + 1][0] <= t) ci++;
    const L = Object.assign({}, BASE, LOOK[CUTS[ci][1]]);
    const local = t - CUTS[ci][0];
    const frame = Math.floor(t * FPS);
    const light = L.bg === "cream" || L.bg === "light";
    const inkSet = light ? GLYPH.dark : GLYPH.light;
    const phase = t * L.speed + ci * 0.7;

    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = BG[L.bg];
    ctx.fillRect(0, 0, W, H);

    const frameR = rngFrom(frame * 7919 + 13);
    if (L.glyphField) drawGlyphField(L, rngFrom(ci * 31 + Math.floor(frame / 3)), inkSet);
    if (L.scatter && !L.glyphField) drawScatterRows(L, rngFrom(ci * 131 + 7), light);
    if (!L.scatter && L.strands) {
      if (L.rungs) drawRungs(L, phase, frameR, light, t);
      drawStrands(L, phase, rngFrom(ci * 17 + frame), inkSet, light);
    }
    if (!L.strands) drawScatterRows(L, rngFrom(ci * 131 + 7), light);
    if (L.particles > 0 || L.boxes > 0) drawParticles(L, phase, rngFrom(ci * 977 + 3), frameR, light, local);
    drawScanlines(frameR, light);
    ctx.globalAlpha = 1;
  }

  // Exposed for frame-by-frame video export.
  window.renderHelixFrame = (i) => render(i / FPS);

  let start = null;
  function loop(now) {
    if (start === null) start = now;
    render((now - start) / 1000);
    requestAnimationFrame(loop);
  }
  if (location.hash !== "#export") requestAnimationFrame(loop);
  else render(0);
})();
</script>
</body>
</html>
